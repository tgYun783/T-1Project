# T1 팀 사용자 핵심 흐름. 대시보드와 주최 측 실행이 main의 이 파일을 읽는다.
# 출처: docs/problem.yaml functional_spec(R1~R13), docs/api.md, docs/develope/screen-spec.md(2026-10-30 새 기획). 이전 S1~S6(이력서·모의면접)은 버림.
# 메뉴·버튼·입력칸 이름은 frontend/specs/의 「화면 글자」 표와 같다. 바뀌면 이 파일, specs, E2E spec을 같은 commit에서 고친다.
# S1~S3은 AI 결과에 기대지 않는다. S4~S6은 AI를 부르므로 결과를 특정 문장이 아니라 "상태 글자가 보인다" 수준으로 확인한다.
# 주최 측 자동 실행 브라우저에는 마이크·카메라가 없다. 이 서비스의 답변은 모두 글이다(R3, R10).
# 선행 데이터는 docker compose 첫 기동 시드로 넣는다(계정 SEED_USER_EMAIL/SEED_USER_PASSWORD). 내용은 frontend/specs/mock-data.md 「시드」와 같다:
#   확정 사실이 있는 경험 카드 2개(캡스톤디자인 학과 공지 알림 앱, 교내 해커톤 동아리 회비 정산 웹), AI 초안을 그대로 붙여넣은 자소서 1개.
platform: desktop
platformReason: |
  (학생 답 2026-10-30) 데스크톱 우선. 자소서 작업 환경(노트북) 기준으로 만들고, 모바일은 깨지지 않게만 한다.
scenarios:
  - id: S1
    title: 처음 온 취준생이 가입하면 경험부터 등록하라는 안내를 본다
    steps:
      - "첫 화면에서 '가입하기'를 누른다"
      - "'이메일'에 새 이메일을, '비밀번호'에 비밀번호를 입력하고 '가입하기'를 누른다"
    expected: "로그인된 상태로 홈이 열리고, 경험 카드를 먼저 하나 확정해야 자소서를 쓸 수 있다는 안내와 '이력서 입력' 버튼이 보인다. '새로 쓰기' 버튼은 보이지 않는다"
  - id: S2
    title: 새 취준생이 이력서 화면에서 활동을 직접 추가해 경험을 만들고 사실을 적어 자소서 잠금을 푼다
    steps:
      - "첫 화면에서 '가입하기'를 누르고 새 이메일과 비밀번호로 가입한다"
      - "홈에서 '이력서 입력'을 누른다"
      - "'활동 직접 추가'를 누르고 '활동 이름'에 '교내 해커톤 동아리 회비 정산 웹'을, '대략적 시기'에 '2025년 여름'을 입력한 뒤 '목록에 추가'를 누른다"
      - "'경험 만들기'를 누른다"
      - "경험 상세 화면의 경험 카드에서 '직접 추가'를 누른다"
      - "'항목'에서 '역할'을 고르고, '내용'에 '팀장으로 기능 범위를 정하고 발표를 맡았다'를 입력하고, '내가 말함'을 고른 뒤 '카드에 추가'를 누른다"
      - "위쪽 메뉴에서 '자소서'를 누른다"
    expected: "경험 카드의 역할 칸에 입력한 내용이 '내가 말함'과 함께 보이고, 자소서 화면에서는 잠금 안내 대신 '새로 쓰기'와 '쓴 자소서 붙여넣기' 버튼이 보인다"
  - id: S3
    title: 취준생이 이미 쓴 자소서를 붙여넣어 저장한다
    account: 취준생
    steps:
      - "위쪽 메뉴에서 '자소서'를 누른다"
      - "'쓴 자소서 붙여넣기'를 누른다"
      - "'본문'을 비운 채 '저장'을 누른다"
      - "'본문'에 '저는 동아리 회비 정산 웹을 만들며 입금 내역을 엑셀로 받아 화면에 올리는 기능을 맡았습니다.'를 입력하고 '저장'을 누른다"
      - "위쪽 메뉴에서 '자소서'를 누른다"
    expected: "본문이 비었을 때는 저장되지 않고 이유가 보인다. 입력한 뒤 저장하면 자소서 상세에 본문이 그대로 보이고, 자소서 목록에 '붙여넣음' 자소서가 하나 늘어 있다"
  - id: S4
    title: 취준생이 경험 대화에서 AI 질문에 글로 답하고 항목 상태를 본다
    account: 취준생
    steps:
      - "위쪽 메뉴에서 '경험'을 누른다"
      - "목록에서 '교내 해커톤 동아리 회비 정산 웹'을 연다"
      - "AI의 첫 질문이 보이면 '답변'에 '회비 입금 내역을 엑셀로 받아 정산 화면에 올리는 기능을 제가 만들었습니다.'를 입력하고 '보내기'를 누른다"
    expected: "대화에 방금 보낸 답과 AI의 다음 질문이 보이고, 상황·역할·행동·결과·의의 다섯 항목 중 하나 이상에 '설명됨', '추가 확인 필요', '모름·경험 없음' 중 하나가 보인다. 사실 후보가 생기면 'AI 제안·미확인'으로 표시된다. AI 호출에 실패하면 에러 안내와 '다시 시도' 버튼이 보이고 입력한 답은 입력칸에 남아 있다"
  - id: S5
    title: 취준생이 문항마다 경험 카드를 골라 자소서 응답을 만든다
    account: 취준생
    steps:
      - "위쪽 메뉴에서 '자소서'를 누른다"
      - "'새로 쓰기'를 누른다"
      - "'우대사항'에 'REST API 설계 경험, 협업 도구 사용 경험'을, '인재상'에 '문제를 끝까지 파고드는 사람'을, '문항 1'에 '직무 관련 경험을 바탕으로 본인의 강점을 서술하시오'를 입력하고 '작성 시작'을 누른다"
      - "추천된 경험 카드가 보이면 '캡스톤디자인 학과 공지 알림 앱'을 켜고 '이 문항 만들기'를 누른다"
    expected: "문항 1의 응답 글이 보이고, 그 아래 근거로 쓴 경험 카드로 '캡스톤디자인 학과 공지 알림 앱'이 보인다. 자소서 목록에 '작성함' 자소서가 하나 늘어 있다. AI 호출에 실패하면 에러 안내와 '다시 시도' 버튼이 보인다"
  - id: S6
    title: 취준생이 붙여넣은 자소서를 제출 전에 점검한다
    account: 취준생
    steps:
      - "위쪽 메뉴에서 '자소서'를 누른다"
      - "목록에서 시드 자소서 '가나다소프트 백엔드 지원'을 연다"
      - "'제출 전 점검 시작'을 누른다"
      - "점검할 문장 목록과 첫 질문이 보이면 '답변'에 '실제로 재지는 않았고, 공지를 놓쳤다는 말이 줄었다는 반응만 들었습니다.'를 입력하고 '답하기'를 누른다"
    expected: "점검할 주장 문장 목록이 보이고, 방금 낸 답이 기록에 추가된다. 그 문장에 다음 질문이 보이거나, '설명됨', '추가 확인 필요', '모름·경험 없음' 중 하나가 보인다. 점수는 어디에도 보이지 않는다"
