# T1 팀 사용자 핵심 흐름. 대시보드와 주최 측 실행이 main의 이 파일을 읽는다.
# 출처: docs/problem.yaml features F1~F9(팀원 설계 docs/interview-design.md + 학생 답 2026-10-29).
# 메뉴·버튼 이름은 화면이 아직 없어 Agent가 임시로 붙인 것(2026-10-29). 프런트 구현 시 실제 이름으로 맞추고, 바뀌면 이 파일과 spec을 같은 commit에서 고친다.
# 주최 측 자동 실행 브라우저에는 마이크·카메라가 없으므로 면접 답변은 글자 입력으로 쓴다(F6 글자 답변 경로). 질문은 TTS와 함께 글자로도 보인다(F5).
# 선행 데이터는 docker compose 첫 기동 시 시드로 넣는다: 취준생 계정 1개, 그 계정의 이력서 1개(항목 2~3개 채움), 자기소개서 1개, 끝난 면접 결과 1개(자기소개서 수정 제안 1개 포함).
platform: desktop
platformReason: |
  (학생 답 2026-10-29) 사용자 얼굴(카메라 화면), 내가 말하거나 적는 텍스트, 면접관 화면 등 면접 화면에 넣어야 하는 UI 요소가 많다.
  취준생이 자기소개서를 쓰고 음성으로 모의면접을 보는 작업이라 넓은 화면의 PC 브라우저를 기준으로 만든다.
scenarios:
  - id: S1
    title: 취준생이 회원가입해 로그인 상태가 된다
    steps:
      - 첫 화면에서 '회원가입'을 누른다
      - 이메일과 비밀번호를 입력하고 '가입하기'를 누른다
    expected: 로그인된 상태로 '내 이력서' 화면이 열리고, 화면 위쪽에 가입한 이메일이 보인다
  - id: S2
    title: 취준생이 이력서를 붙여 넣고 태그를 골라 경험을 더해 저장한다
    account: 취준생
    steps:
      - 위쪽 메뉴에서 '내 이력서'를 누른다
      - "'기본 이력서' 칸에 '컴퓨터공학 4학년. 웹 동아리 2년, 해커톤 2회 참가.'를 입력한다"
      - "'태그 고르기'에서 '직무 관련 성공경험'과 '팀워크 및 협업경험'을 누른다"
      - "직무 관련 성공경험 칸에 '동아리 웹사이트 로그인 오류를 찾아 고쳤다'를 입력한다"
      - "팀워크 및 협업경험 칸에 '해커톤에서 4명과 역할을 나눠 48시간 안에 완성했다'를 입력한다"
      - "'저장'을 누른다"
    expected: 저장 완료 표시가 보이고, 페이지를 새로고침해도 기본 이력서 글과 고른 두 태그·입력한 내용이 그대로 보인다
  - id: S3
    title: 취준생이 저장된 이력서로 자기소개서 초안을 만든다
    account: 취준생
    steps:
      - 위쪽 메뉴에서 '내 자기소개서'를 누른다
      - "'이력서로 초안 만들기'를 누른다"
    expected: 자기소개서 초안 본문이 화면에 보이고, '내 자기소개서' 목록에 새 항목이 하나 늘어난다. 생성에 실패하면 에러 안내가 보이고 목록은 늘지 않는다
  - id: S4
    title: 취준생이 이미 쓴 자기소개서를 붙여 넣어 등록한다
    account: 취준생
    steps:
      - 위쪽 메뉴에서 '내 자기소개서'를 누른다
      - "'자기소개서 등록'을 누른다"
      - "본문 칸에 '저는 동아리 웹사이트의 로그인 오류를 직접 찾아 고친 경험이 있습니다.'를 입력한다"
      - "'저장'을 누른다"
    expected: "'내 자기소개서' 목록에 방금 등록한 자기소개서가 보이고, 열면 입력한 본문이 그대로 있다. 본문을 비우고 저장하면 저장되지 않고 이유가 보인다"
  - id: S5
    title: 취준생이 자기소개서를 골라 모의면접을 시작하고 글자로 답한 뒤 종료한다
    account: 취준생
    steps:
      - 위쪽 메뉴에서 '모의면접'을 누른다
      - 자기소개서 목록에서 시드 자기소개서를 고르고 '면접 시작'을 누른다
      - 면접관 이름과 첫 질문이 글자로 보이면 '글자로 답하기'를 누른다
      - "답변 칸에 '제가 로그인 오류의 원인을 로그에서 찾아 세션 만료 처리를 고쳤습니다.'를 입력하고 '답변 제출'을 누른다"
      - 다음 질문(꼬리질문 또는 다음 본질문)이 보이면 '면접 종료'를 누른다
    expected: 결과 화면이 열리고 질문·답변 기록에 방금 낸 답변이 면접관 이름과 함께 한 줄 있으며, 종료 사유가 '사용자 종료'로 표시된다. 종합 점수는 보이지 않는다
  - id: S6
    title: 취준생이 지난 면접 결과를 열어 자기소개서 수정 제안을 승인한다
    account: 취준생
    steps:
      - 위쪽 메뉴에서 '면접 기록'을 누른다
      - 목록에서 시드로 들어 있는 끝난 면접을 연다
      - "'자기소개서 수정 제안'에서 첫 제안의 '승인'을 누른다"
    expected: 제안이 '반영됨'으로 바뀌고, '내 자기소개서'에서 해당 자기소개서를 열면 제안대로 바뀐 문장이 본문에 들어 있다
