#   ⑤는 A1(범용 AI). A2~A4는 캔버스에 유지하되 모두 같은 한계가 있다고 일반화하지 않음.
statement: >-
  직무 관련 경험은 있지만 평소 정리해 두지 않은 첫 구직 취준생은
  자소서 제출 전과 면접 준비 과정에서, 문장에 담긴 역할·성과·수치가
  실제 경험과 맞는지 점검하고 그 근거를 자기 말로 설명하는 데 어려움을 겪는다.
  지금은 범용 AI로 자소서 초안과 예상 답변을 만들어 준비하지만,
  문장을 완성하고 외운 뒤에도 수치의 계산 방법이나 본인이 한 행동을
  구체적으로 설명하지 못해 막막함을 느끼거나 면접 꼬리질문에서 답이 막히는 경우가 있다.
canvas:
  # context: 팀 문구(2026-10-30). 빈도 근거는 S23(S14·S22는 이미 다른 자료라 다음 번호로 등록).
  context: |-
    ① 상황

    언제: 지원 공고를 확인하고 자소서를 작성하는 시점부터 면접을 준비하고 응시하는 시점까지.
      자소서 문항에 맞는 경험과 본인의 기여를 정리할 때,
      그리고 작성한 내용을 면접의 추가 질문에 맞춰 설명해야 할 때 어려움이 드러난다.

    어디서: 자소서를 작성하고 답변을 연습하는 개인 준비 공간과 실제 대면·화상 면접 환경.
      학교·자취방·도서관은 준비 공간의 예시다.

    얼마나 자주: 대학내일20대연구소의 2024년 조사에서 취업 준비 경험자는
      지난 1년간 평균 6.4개 기업에 지원하고 평균 2회의 채용 면접을 경험했다 [S23].
      해당 조사 집단의 평균이며, 첫 취준생만의 수치나 팀원의 실제 횟수는 아니다.

    반복 양상: 공고·자소서 문항 확인 → 직무에 맞는 경험 선택 → 본인의 역할·행동·결과를 정리해 자소서 작성
      → 면접을 앞두고 작성한 경험의 예상 질문과 답변 준비
      → 실제 면접에서 본인 기여·선택 이유 등에 대한 추가 질문에 답변
      → 결과 확인 → 다음 기업 지원 시 경험 선택·서류 작성·면접 준비를 다시 진행.

    실제 사례: E2는 자소서에서 협업 과정과 본인의 기여도를 정리하기 어려웠던 연계형 인턴 지원 사례다.
      E3은 취업 면접에서 본인의 역할을 묻는 꼬리질문에 답변이 막힌 사례다.
      E4는 취업 면접에서 자소서에 적힌 수치("폐기율 15%")의 계산 방법·기간을 묻는 질문에 답하지 못한 면접 단계 사례다(학생 답 2026-10-30).
      E1은 소프트웨어 마에스트로 선발 면접 사례이므로 취업 면접의 직접 근거와 구분한다.
      네 사례는 단계별 어려움을 보여주며, 같은 사람이 이 전체 과정을 반복했다는 뜻은 아니다.
  # 2026-10-30 학생 확인: statement의 고객 문장에 맞춤. "기록을 남기지 않아 말 말고는 증명할 게 없는 사람"(옛 초점)과
  #   초점과 직접 이어지지 않는 S24(막막 83%)·S29(서류 합격률) 줄은 뺌. 이전 문장은 git 기록에 있음.
  customer: |-
    직무 관련 경험은 있지만 평소 정리해 두지 않은 첫 구직 취준생(4학년 2학기·졸업예정).
    프로젝트·동아리·대외활동 경험은 있지만, 자소서 제출 전과 면접 준비 과정에서
    문장에 담긴 역할·성과·수치가 실제 경험과 맞는지 점검하고 그 근거를 자기 말로 설명하는 데 어려움을 겪는 사람.
  # 2026-10-30 숫자 해석 정리(학생 요청): 일부 응답자 기준 비율 표기, 서로 다른 조사 인과 연결 제거, E4는 사례로 표시,
  #   "왜 아직 못 고쳤나"를 기존 해법의 출발점 사실로 다시 씀, impact에 S22·S8 손실 추가, S3 "이유 1위"(경험·스펙 없음)는 고객과 맞지 않아 뺌.
# 2026-10-30 오래된 자료 교체(학생 요청): S2 87.7%→S24(2025) 83%, S9(2019)→사람인 2020(1,785명)·S25(2021) 함께 표기,
#   S5(2019, 실무면접 35.2%)는 최신 조사가 없고 S4·S22로 대체돼 삭제, "자포자기 29.1%"(2019만 있음) 삭제,
#   "지원 포기 65.5%"(S3)는 포기 이유 1위가 경험·스펙 없음(S3)이라 우리 원인과 맞지 않아 impact에서 삭제.
  # S2는 2019년 신입·경력 구직자의 자기소개서·이력서 작성 관련 조사다.
  # 아래 핵심 초점은 팀이 정한 문제 해석이며, 모든 취준생의 공통 원인으로 검증한 것은 아니다.
  # E2·E3는 팀이 전달·정리한 사례이고, E4는 팀 밖 한 사람의 인터뷰다.
  root_problem: |-
    ③ 근본 문제

    왜 생기나
    - 경험을 평소 정리하지 않은 점이 서류 작성의 어려움으로 보고됐다.
      신입·경력 구직자 조사에서 자기소개서·이력서 작성이 막막한 이유로
      "스펙·경력 등을 평소에 정리하지 않아서"가 47.3%로 가장 많이 꼽혔다 [S2].

    - E2는 협업 경험이 있었지만 본인의 기여와 해결 과정을 구체적으로 정리하기 어려웠다.
      E3은 외운 대본에 의존해 준비했고, 본인의 역할을 따로 묻는 질문에서 답변이 막혔다 [E2][E3].

    - E4는 AI가 추가한 수치와 표현을 확인하지 않고 제출했다가,
      계산 방법·기간·사용 도구를 묻는 질문에 답하지 못했다.
      반면 직접 작성한 동아리 회계 경험은 꼬리질문에도 설명할 수 있었다 [E4].
      (간접) 제출된 자기소개서 중 AI 작성이 의심되는 비율은 48.5%(2024)에서 64.4%(2025)로,
      모든 문항을 AI로 쓴 것으로 추정되는 비율은 8.9%에서 20.6%로 늘었다.
      기사는 이를 "AI가 생성한 자기소개서를 수정 없이 그대로 제출하는 경향"으로 해석했다(탐지 도구 추정치) [S28].

    - 팀이 정한 핵심 초점은 "어떤 문장이 내가 근거를 대고 설명할 수 있는 내용인지 스스로 구분하지 못함"이다.
      경험을 정리하는 어려움에 더해, 완성된 자소서 문장을 실제 행동·판단·수치의 근거와 대조해
      제출 전에 설명 가능 여부를 점검하는 문제에 집중한다.

    왜 아직 못 고쳤나
    - 경험 정리·자소서 작성 서비스와 답변 기반 꼬리질문 서비스는 이미 제공되고 있다 [S17][S18][S20].
      따라서 필요한 기능이 시장에 없다고 설명하기보다, 실제 사용 과정에서 남은 어려움을 살펴본다.

    - E4는 AI 초안과 예상 질문을 활용하고 답변을 외웠지만,
      준비한 질문에는 수치의 계산 근거를 묻는 내용이 없었고 제출 전에도 이를 확인하지 않았다.
      이 사례에서는 글과 예상 답변의 완성이 문장별 근거 점검으로 이어지지 않았다 [E4].

    - 이후 E4는 문장마다 실제 있었던 일인지, 질문받으면 답할 수 있는지를 직접 메모했다.
      그러나 혼자서는 어디까지 확인해야 하는지 모르겠고 점검 시간도 늘었다고 말했다.
      현재 확인된 미해결 부담은 이 사례의 설명 가능 여부 판단과 직접 점검에 드는 수고다 [E4].
  impact:
    feeling: |-
      ④ 그때 한 말·기분

      - E1(팀원 본인): 면접에서 떨리고 머리가 하얘졌으며, 준비한 내용을 충분히 말하지 못한 뒤 자기 의심을 느꼈다.
        "내 역량은 100인데 면접장만 가면 30이 되는 것 같아. 준비한 건 다 말도 못 했어."

      - E2(지인의 경험을 팀이 정리): 협업 노력을 구체적인 근거로 보여 주기 어렵다는 무력감을 느꼈다.
        자소서 작성에 시간을 쓰고도 결과가 좋지 않자 허탈함과 초조함을 느꼈고,
        다른 기업의 지원 기회까지 놓쳤다는 부담이 남았다.

      - E3(친구의 경험): 본인의 역할을 묻는 추가 질문에서 머리가 하얘지고 답변이 막혔다.
        이후 면접에 대한 두려움이 커져 지원 자체도 두려워하게 됐다고 보고됐다.

      - E4(팀 밖 인터뷰): 한 문장에서 답변이 막힌 뒤,
        면접관이 다른 문장까지 의심하는 것처럼 느꼈다고 말했다.
        "직접 겪은 건 말이 되는데, AI가 다듬은 문장은 제 말이 아니라서 거기서 더 들어가면 막히더라고요."
    measurable: |-
      ④ 잃은 시간·횟수·기회

      - 작성에 쓴 시간: 팀이 정리한 E2 기록에서는 자소서 한 건을 며칠 동안 붙잡고 작성했다.
        정확한 소요 시간은 확인되지 않았다.

      - 놓친 지원 기회: E2는 해당 자소서를 작성하는 동안
        같은 주에 마감한 다른 기업 두 곳의 지원서를 작성하지 못했다고 보고됐다.
        제출한 기업에서는 서류 불합격했으나, 불합격 원인은 확인되지 않았다.

      - 추가 점검 부담: E4는 면접 이후 AI 초안의 문장마다 실제 경험인지,
        질문받으면 설명할 수 있는지 직접 메모하기 시작했다.
        이 점검으로 작성 시간이 두 배로 걸린다고 보고했다.
        이는 개인의 자가보고이며, 비교 기준과 실제 소요 시간은 미측정이다.

      - 보조 자료: 2017년 KT 대학생 활동단 255명 조사에서는
        자소서 한 개 작성에 평균 7시간이 소요됐다고 보고됐다 [S10].
        과거 조사 집단의 작성 시간이며, 전부를 불필요하게 잃은 시간으로 계산하지 않는다.

      - 서류전형 합격률: 4년제 대학 재학·졸업자 평균 19.4%(작년 22.2%), 취업 준비 기간 6개월 이상 62.6%·그중 1년 이상 32.5%(한경협, 2025) [S29]

      지표(이름만, 값은 아직 없음, 팀 결정 대기):
      - 서비스 안: 자소서 문장 중 꼬리질문에 근거를 댄 비율, 제출 전 점검에 쓴 시간
      - 서비스 밖: 면접 진출 대비 최종 합격률, 면접 준비에 쓴 시간
  alternatives:
    # 2026-10-30 대안 재정리(학생 요청): 근본 문제 Why 5를 잣대로 "제출 전에 내가 설명할 수 있는 문장인지 점검해 주는가, 비용·접근성은?"으로 통일.
    #   A1 "기업은 부정적" 단정은 S26(2025, 의견이 갈림)으로 고침, 다른 집단 통계(S2) 연결 제거. A2 사용률은 국내 조사 없음을 밝힘.
    #   A3 첨삭은 S27(2026)로 받치고 단점을 비용으로. A4는 "확인 안 됨"이 단점이 아니라서 비움. why_ours는 팀원 수정안 그대로.
    # 2026-10-30 ⑥ 단점 갱신(학생 검토본): A1은 E4 사례로 남는 문제를 적고, A2~A4는 원문으로 확인한 이용 제한·비용만 적음. 핵심 문제 비교는 항목별 주석에 미확인으로 둠.
    - how_used: |-
        A1: 범용 AI로 자소서 초안·예상 질문 만들기
        취준생의 98%가 취업 준비에 AI를 쓰고, 자소서 초안 작성(84%)·면접 예상 질문 생성(67%)에 쓴다(2026) [S6]
      shortcoming: |-
        AI로 초안과 예상 질문을 준비했지만, 자소서의 수치·표현을
        자신의 실제 행동과 근거로 설명하지 못하는 문제가 남았다(팀이 진행한 인터뷰) [E4].
        E4는 AI가 넣은 "폐기율 15%"를 "그냥 뒀다"고 했고,
        면접에서 계산 방법·기간과 "데이터 기반"에 해당하는 도구를 설명하지 못했다.
        준비한 AI 예상 질문에는 해당 수치의 근거를 묻는 질문이 없었다.
        반면 직접 쓴 동아리 회계 경험은 꼬리질문에도 답했다.
      why_ours: |-
        (설계) 경험을 대화로 구체화하고, AI가 뽑은 사실을 사용자가
        확인·수정·삭제한 뒤 확정한 내용만 경험 카드에 저장한다.
        자소서는 확정한 사실로 작성하고, 생성된 주장 문장은 제출 전에
        근거 질문으로 점검한다.
        범용 AI도 질문과 경험 정리를 할 수 있으므로 기능의 독점성을 주장하지 않는다.
        차이는 질문·사실 확인·저장·작성·점검을 정해진 흐름으로 연결하는 데 둔다.
        효과가 더 좋은지는 비교 검증이 필요하다.
    - how_used: |-
        A2: 서류 기반 AI 모의면접 서비스
        사람인·코드잇 어센트·패스잇·면접도우미가 이력서·자소서·공고로 질문과 꼬리질문을 만든다 [S11][S12][S16][S19][S20].
        (사용률 확인 안 됨) 국내 취준생의 이용률 조사는 찾지 못했다.
      shortcoming: |-
        일부 서비스는 반복 연습에 이용 기간이나 AI 첨삭 횟수의 제한이 있다.
        사람인은 구매일로부터 30일간 이용하도록 안내하고 [S20],
        면접도우미는 질문 준비·모의면접은 무료지만 AI 첨삭 이용 횟수는 제한한다 [S19].
      # 확인 필요: 자소서의 수치·역할 표현마다 근거를 질문하는지,
      # 답하지 못한 내용을 제출 전 수정·사실 정리로 연결하는지는 직접 이용해 확인한다.
      # 서류 기반이라는 이유만으로 제출 전에 사용할 수 없다고 보지 않는다.
      why_ours: |-
        (설계) 모의면접은 하지 않고(기각, 학생 답 2026-10-30),
        자소서 제출 전 문장별 근거 점검에 집중한다.
        AI가 수치·성과·역할·평가 표현이 들어간 문장을 점검 목록으로 제시하고,
        근거 질문에 대한 답변을 설명됨 / 추가 확인 필요 / 모름·경험 없음으로 구분한다.
        답변에서 나온 사실은 사용자 확인을 거쳐 경험 카드에 저장한다.
      # ⑥에 적힌 이용 기간·횟수 제한을 우리 서비스가 더 잘 해결한다는 근거는 아직 없다.
      # 위 내용은 현재 설계의 초점이며, 사용량·비용 측면의 비교우위를 뜻하지 않는다.
    - how_used: |-
        A3: 합격 자소서 참고·유료 첨삭
        20대 취준생의 42%가 최근 1년간 유료 취업 서비스를 이용했고, 이용·고민한 서비스 1위는 자소서·이력서 첨삭(59%)이다(2026) [S27].
        자소서가 어려울 때 합격 자소서를 참고한다는 응답은 50.3%였다(2018) [S3].
      shortcoming: |-
        개인별 피드백을 유료 첨삭으로 받으려면 별도 비용이 든다.
        (외부 기사 사례) S27의 A씨는 직접 작성한 초안의 첨삭에 4만 원을 지불했으며,
        자소서 개수·지원 기업 수에 따라 20만 원을 넘는 서비스도 있었다 [S27].
      # 합격 자소서 참고 후에도 남는 어려움은 직접 확인하지 못했다.
      # 금액은 기사 사례이며 전체 서비스의 평균·최저가가 아니다.
      why_ours: |-
        (설계) 참고하거나 첨삭받은 자소서도 본인의 실제 경험과 대조할 수 있도록,
        문장에 담긴 수치·역할·행동의 근거를 질문한다.
        사용자는 설명하지 못한 내용을 확인하고 경험 카드를 보강한 뒤,
        필요한 경우 해당 문항의 응답을 다시 생성한다.
        전문가 피드백을 대체한다고 주장하지 않는다.
      # ⑥에 적힌 유료 첨삭 비용을 우리 서비스가 줄인다는 근거는 아직 없다.
      # 요금과 운영비가 확정되지 않았으므로 더 저렴하다는 비교우위를 주장하지 않는다.
    # A4 (2026-10-30 추가): 소개 페이지로 확인한 기능만 적음. why_ours는 팀이 정해야 해서 null.
    - how_used: |-
        A4: 취준 올인원 AI 서비스(경험 정리 → 자소서 → 면접)
        커리어마이징 [S17], TIO [S18] (기능은 소개 페이지 기준)
      shortcoming: |-
        경험 정리와 자소서 생성 기능을 이용했어도,
        생성된 글을 그대로 사용하기 어려웠다는 이용 사례가 있다(외부 이용 후기, 협찬).
        커리어마이징 공식 블로그에 게재된 이용자 후기는 AI와 STARR 단계에 맞춰 대화하는 경험 정리 방법을 소개했고,
        AI가 작성한 내용은 글자수가 많으면 할루시네이션도 일어나 바로 가져다 쓸 수는 없다고 적었다 [S30].
      # S30은 2026-06-26 게재, 서비스 이용권·원고료를 제공받은 개인 후기다.
      # 현재 제품 전체의 오류율이나 문장별 사실 확인 기능의 부재를 뜻하지 않는다.
      # 이전 단점(무료 사용량 제한 [S17][S18])은 이 후기로 바꿨다(학생 검토본 2026-10-30). S17·S18 출처 설명은 그대로 둔다.
      why_ours: |-
        (설계) 대화형 경험 정리 자체를 차별점으로 삼지 않는다.
        커리어마이징에서도 AI와 대화하는 경험 정리 방식이 확인된다 [S30].
        우리는 사용자 확인 사실만 경험 카드에 저장하고,
        그 사실로 자소서를 작성한 뒤 제출 전 주장 문장의 근거를 점검하는 흐름에 집중한다.
        점검 답변의 사실도 사용자가 확인한 뒤 저장하며 자소서를 자동 수정하지 않는다.
        이 전체 흐름의 경쟁 서비스 대비 차이와 효과는 별도 비교가 필요하다.
# ===== 대상 PERSONAS (P1, P2) =====
personas:
  # 2026-10-30 학생 요청으로 statement의 초점(제출 전 문장 근거 점검)에 맞춰 재구성. 새 내용은 넣지 않고
  #   statement 고객 문장(학생 답)과 E4·E2·E3에 이미 있는 학생 답만 옮김. 이전 P1(합성 대상, 회의록·톡방 휘발)과
  #   이전 P2(회의록·데이터가 없어 상투적 문장)는 git 기록에 있음.
  # P1은 대표 경험 E4 한 사람의 사례로 만든 대상이다. 같은 처지의 사람이 얼마나 되는지는 확인하지 않았다.
  - id: P1
    description: >-
      직무 관련 경험은 있지만 평소 정리해 두지 않은 첫 구직 취준생(4학년 졸업 예정).
      마감이 몰리면 경험을 간단히 적어 범용 AI로 자소서 초안을 받고 조금씩 고쳐 제출하며,
      AI로 뽑은 예상 질문의 답을 외워 면접을 준비한다.
      AI가 넣은 수치·표현을 실제 경험과 맞춰 보지 않은 채 제출했고,
      면접에서 그 수치의 계산 방법·기간과 본인이 쓴 도구를 묻는 꼬리질문에 답하지 못했다.
      직접 쓴 경험은 꼬리질문에도 설명할 수 있었다.
    source: >-
      statement의 고객 문장(학생 답 2026-10-30)과 E4(팀 밖 인터뷰 1명, 4학년 졸업 예정,
      중견기업 영업관리 면접 2026-10-01 탈락, 인터뷰 2026-10-15)의 확인된 처지만 연결함.
  # P2는 AI 초안 없이도 같은 어려움(쓴 문장 속 본인 역할·기여를 근거로 설명하기)이 나타난 보조 사례다.
  - id: P2
    description: >-
      기획·마케팅·영업 직무 지원자. 협업·성과 경험은 있지만,
      자소서에서 협업·갈등 해결 과정과 본인의 구체적 기여도를 묻는 문항에
      본인의 행동을 구체적으로 쓰지 못하고 상투적인 문장으로 썼거나(E2),
      면접에서 성과 중 본인의 역할을 따로 묻는 꼬리질문에
      외운 답 밖의 본인 행동을 설명하지 못한(E3) 처지.
    source: >-
      E2(팀원의 지인, 서비스 기획·콘텐츠 에디터 인턴 지원), E3(친구, 마케팅/영업 직무 지원).
      확인된 처지만 연결함(학생 답 2026-10-30).
# ===== 실제 경험 EXPERIENCES (E1~E4) =====
# 대표 경험은 E4, E1~E3은 보조 사례(학생 답 2026-10-30). E4의 면접 시점(when)은 학생 답(2026-10-30)으로 채움.
experiences:
  - id: E1
    when: 2026년 초
    what_happened: >-
      소프트웨어 마에스트로 면접. 떨려서 제대로 답을 못 하고 꼬리질문에 막혔다.
      준비한 답만 외우다 보니 꼬리질문에 경험을 못 꺼냈다. 처음 해 보는 면접이라 어떻게 진행되는지 몰랐다.
    workaround: 억지로 짜내려 했으나 결국 답변을 다 하지 못하고 무너졌다. 준비한 대본만 외워 갔다.
    feeling: 떨렸다. 머리가 하얘지고, 끝나고 깊은 자기 의심에 빠졌다.
    quote: 내 역량은 100인데 면접장만 가면 30이 되는 것 같아. 준비한 건 다 말도 못 했어.
    # 학생 답(2026-10-30): 막힌 꼬리질문은 "어떠한 행동을 했을 때 어떤 선택을 했는지"를 묻는 질문이었다.
    source: 팀원 본인의 실제 경험(2026-10-29 대화). 막힌 꼬리질문은 어떤 행동을 했을 때 어떤 선택을 했는지 묻는 질문(학생 답 2026-10-30)
  - id: E2
    when: 약 1년 전(2026-10-29 기준)
    what_happened: >-
      국내 주요 콘텐츠·IT 플랫폼 기업의 '서비스 기획(PM) 및 콘텐츠 에디터' 연계형 인턴 공고.
      포트폴리오 파일 제출보다 자기소개서의 '협업 과정 및 갈등 해결 에피소드'와 '구체적 기여도(%)'를 정밀하게 요구한 서류 전형.
      자기소개서 문항 "팀 프로젝트 중 이견을 조율하고 문제를 해결한 과정과 본인의 구체적인 기여도를 서술하시오" 앞에서 막혔다.
      어떤 답변이 내 경험을 살리면서 좋은 자기소개서가 될지 몰랐다.
      쌓아 온 과정을 정제하고 기업에 맞춰 자소서를 매번 각각 작성하는 일이 어려웠다.
    workaround: >-
      어떻게든 써서 냈지만 좋은 성과가 따라주지 않았다.
      자소서를 직접 작성하는 동안 다른 기업에 서류를 넣을 시간이 부족했다.
      (팀이 지인 이야기를 듣고 정리) 팀장을 맡아 갈등을 중재했지만 제출할 회의록·데이터가 없어
      상투적인 문장("경청하고 소통해서 잘 해결했다")을 쓸 수밖에 없었다. 며칠 동안 붙잡고 겨우 냈지만 서류에서 불합격했고,
      그러느라 같은 주에 마감이던 다른 기업 두 곳은 서류를 써 보지도 못했다.
    feeling: |-
      (팀이 지인 이야기를 듣고 정리)
      문항 앞에서 막혔을 때: 억울함과 깊은 자괴감, 실제 협업 노력을 객관적인 증거로 증명하지 못하는 무력감
      결과가 좋지 않았을 때: 허탈함과 심한 초조함, 한 공고에 시간을 다 빼앗겨 다른 기업 서류 기회까지 날려버린 공포
    quote: 동아리 회장·프로젝트 다 했는데 증명할 게 없네.
    source: 팀원의 지인(4학년 취준생)의 경험. 팀원이 지인에게 직접 들음(2026-10-29 대화). quote는 지인이 실제로 한 말(학생 답 2026-10-30)
  - id: E3
    when: 몇 달 전(2026-10-29 기준)
    what_happened: >-
      마케팅/영업 직무 지원자. 대기업 실무진 다대일 압박 면접.
      "성과가 좋았다고 적혀 있는데, 여기서 본인의 역할을 빼도 전체 결과에 차이가 없지 않나?"라는 압박 꼬리질문을 받았다.
      원인(팀이 친구 이야기를 듣고 정리한 말, 친구가 직접 한 말은 아님): 외운 대본에 의존해 성과(Result)만 늘어놓았을 뿐, 압박 상황에서 내 주도적 행동(Action)을
      말로 즉석에서 풀어내는 실전 음성 순발력 및 담력 훈련이 안 되어 있었다.
    workaround: >-
      외운 대본에 의존해 성과만 늘어놓았다. 외운 범위를 벗어나자 답변이 중단됐다.
    feeling: >-
      머리가 하얗게 비었다. 면접 울렁증이 심해져 이후 지원 자체를 두려워하게 됐다.
    quote: >-
      "외운 대본에서 한 발짝만 벗어나니까 진짜 입도 뻥긋 못 하겠더라. 면접관이 '거기서 본인 빼도 결과는 똑같았을 것 같은데요?' 하고 딱 찌르는데,
      순간 머리가 새하얘지면서 어버버하다 정적만 흘렀어. 외운 문장 말고는 내 진짜 행동을 말로 바로 뱉어내는 실전 훈련이 전혀 안 되어 있다는 걸 깨닫고 나니까,
      이젠 면접장에 들어가는 것 자체가 너무 무서워."
