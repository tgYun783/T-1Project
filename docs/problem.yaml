  # 학생 답(2026-10-30): 인터뷰한 인원은 1명.
  # 주의: 1명·면접 1번의 사례다. Q2는 답을 유도하는 질문, Q7은 해법을 묻는 질문이었다. 면접관이 의심했다는 것은 본인 느낌이다.
  - id: E4
    when: 2026-10-01(면접일)
    what_happened: >-
      영업관리 직무 지원. 경험을 대충 적어 ChatGPT에 넣고 "영업관리 직무에 맞게 400자로 써 줘" 해서 나온 걸 조금씩 고쳐 냈다.
      마감이 몰려 한 회사에 30분도 못 썼다.
      자소서에 "카페 아르바이트 때 재고 데이터를 분석해 폐기율을 15% 줄였다"고 썼는데, 실제로는 유통기한 지난 우유가 좀 줄었던 정도였다.
      AI가 숫자를 넣어 그럴듯하게 만든 걸 그냥 뒀다. 면접관이 "15%는 어떻게 계산하셨어요? 기간은요?" 하고 물었는데 할 말이 없었다.
      "데이터 기반"도 본인이 쓴 표현이 아니라서, 엑셀을 썼냐는 질문에 또 막혔다.
      직접 거의 다 쓴 동아리 회계 이야기는 꼬리질문이 와도 술술 나왔다.
    workaround: >-
      면접 전에 자소서를 출력해 문장을 외웠고, AI로 뽑은 예상 질문의 답도 외웠다. "이 숫자 근거가 뭐냐" 같은 질문은 예상 질문에 없었다.
      면접에서는 "정확한 수치는 기억이 안 나지만 체감상…" 하고 얼버무렸다.
      그 뒤로는 AI 초안을 받으면 문장마다 "이거 진짜 있었던 일인가, 물어보면 답할 수 있나"를 메모한다.
      혼자 하니까 어디까지 파고들어야 하는지 모르겠고, 시간도 두 배로 걸린다.
    feeling: >-
      딱 한 문장에서 무너졌다. 그다음부터 면접관이 자소서의 다른 문장도 하나씩 의심하는 느낌이었다(본인 느낌).
    quote: >-
      "직접 겪은 건 말이 되는데, AI가 다듬은 문장은 제 말이 아니라서 거기서 더 들어가면 막히더라고요."
      "내용을 내 말로 다시 정리해야 한다는 생각은 못 했어요."
      "제출하기 전에 누가 '이 15%는 어디서 나온 거예요?'라고 한 번만 물어봐 줬으면 좋았을 것 같아요. 면접관처럼요."
    source: 팀 밖 취준생 인터뷰(4학년 졸업 예정, 중견기업 영업관리 면접에서 탈락). 인터뷰 2026-10-15. 팀이 Q1~Q7 답변을 채팅으로 전달함(2026-10-30)
