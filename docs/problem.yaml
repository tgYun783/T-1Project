# T1 팀 문제정의. 종이 캔버스(2026-10-29, 팀원 JW·TK·HN·SG·HE)와 팀이 만든 초안(2026-10-29)에서 옮김.
# 출처 표시: "(종이)" 종이 캔버스 원문 / "(팀 초안)" 종이에는 없고 팀이 초안으로 적은 것 / "(팀 답 날짜)" 대화에서 팀이 답한 것 /
#   "(정리본)" 2026-10-29 팀이 최신으로 확정한 캔버스 ①~⑥ 정리본 / "(정리본 보강)" 정리본 중 종이에 없던 부분. 종이와 초안·대화에 없는 내용은 null 또는 []로 둔다.
# 현재 기준은 정리본이다. 아래 "이전 초점"은 정리본 전에 팀이 정했던 초점으로, 기록을 위해 남긴다.
# 이전 초점(2026-10-29): 정량 전형(서류·인적성·코테)을 통과한 뒤 면접 정성평가에서 당황하는 구직자.
#   이유: 서류 쪽은 비슷한 서비스가 많지만 면접 쪽은 그렇지 않아 면접에 집중하는 게 경쟁력이 있다고 봄. Claude로 검색해 확인, 출처는 없음(팀 판단).
#   이 이유가 정리본 뒤에도 그대로인지는 학생 답 대기.

# statement: 팀이 최신 정리본 기준으로 확정한 한 문장(2026-10-29). "서류 작성을 포기"한 실제 장면은 학생 답 대기.
statement: >-
  정량적 스펙 중심으로 준비해 온 취준생이 자신의 구체적인 기여도와 문제 해결 역량을
  논리적으로 설명하지 못해, 서류 작성을 포기하고 실전 압박 면접에서 무너지는 문제
canvas:
  context: |-
    (종이)
    시간: 4학년 2학기, 졸업예정자, 취준생
    장소: 학교, 자취방, 부트캠프 ... 어디서든
    반복양상: 취준생 취업시즌 → 채용공고 → 면접 → 결과확인
      ① 채용공고 확인
      ② 지원하기 ← 템플릿에 맞게 지원서 작성 (난사 / 직무적격) 특정회사(대기업·공기업·스타트업·중견)
      ③ 서류 검토 → 2. 인적성/AI면접/코테 → 3. 면접(임원, 기술...)
    특징: 채용서류에 몰린다. 병렬적으로 진행됨. 매일 수요가 존재.
    (정리본 보강)
    시간: 상/하반기 공채 시즌, 공고가 뜬 뒤 ~ 면접 직전에 집중 발생
    반복 양상 (1인 기준): 공고 확인 → 직무 보고 "내 경험 중 뭘 녹일지" 고민 → 템플릿 지원서(사진·경험·프로젝트·포폴·자소서) 작성
      → 서류 → AI역검/인적성/코테 → 1·2차 면접(실무·임원) → 결과 확인 → 다음 공고로 반복
    특징: 채용 시즌에 몰림, 병렬 지원(난사 / 직무 저격 / 특정 회사·기업유형), 높은 매일 수요.
      경력이 없어 경험을 쌓고 싶어도 뽑아주지 않는 순환 구조
  customer: |-
    (종이)
    구직자
    회사
    (정리본)
    1차 고객: 구직자 — 처음 구직하는 취준생
      4학년 2학기, 프로젝트 7~8개·해커톤·동아리·대외활동은 했지만 블로그/기록이 없어
      "내가 한 걸 말 말고는 증명할 수 없는" 사람
      서류는 붙는데 면접에서 떨어지거나, 경험은 많은데 직무에 맞게 어필할 줄 모르는 사람
      (확장) 취업 정보 과잉으로 뭘 먼저 할지 모르는 2~3학년
    2차(보조): 회사 — 서류가 다 비슷해 실제 역량을 가려내기 힘든 채용 담당자.
      단, 멘토 조언대로 무게중심은 취준생 한쪽에 둠
    (팀 답 2026-10-29) 무게중심을 구직자에 둔 이유: 구직자가 팀 상황에 더 가깝고 공감할 수 있어서.
      팀원들도 각자 면접 때문에 고민한 경험이 있다.
  # customer 학생 답 대기: "프로젝트 7~8개"가 누구 이야기인지(특정 인물이면 personas로), 2~3학년·회사를 범위에 넣는지, 팀 밖에서 겪은 사람.
  root_problem: |-
    (정리본)
    왜 생기나
    - 경험은 있는데 구조화·증명이 안 됨 — 활동 당시 기록을 남기지 않고, 면접에서 "상황-과제-행동-결과"로 설명하는 훈련이 없음.
      AI가 써준 자소서는 길고 다 비슷해 변별이 사라짐
    - 정보 비대칭 — 기업은 원하는 역량·인재상·내부 의도를 공개하지 않고 불합격 사유도 알려주지 않음.
      신입은 직무 인맥이 없어 지인 추천·커피챗 같은 "사람 통로"가 막혀 있음
    - 기업은 서류로 실제 역량을 판별 못 해 정량 컷(학점·어학·자격증)으로 거르고, 신입은 레퍼런스 체크도 불가
      → 정성 역량이 평가 테이블에 올라가지 못함
    왜 아직 못 고쳤나
    - 기존 서비스(인프런·잡다·원티드·하이잡)는 일반 강의·일회성 모의면접이라 "내 경험"에서 출발하지 않고,
      시즌에만 쓰여 데이터가 쌓이지 않음
    - 범용 AI(GPT/Claude)는 넣은 것만 다듬을 뿐 캐묻지 않음 — 재료(경험) 자체를 끌어내는 단계가 없음
    - 기업·구직자 양면을 동시에 풀려다 어느 쪽도 뾰족하게 정의되지 못함
  # root_problem 학생 답 대기: "왜 아직 못 고쳤나" 세 줄이 ⑥ 단점과 겹침(⑥으로 합칠지), 인프런·잡다·원티드·하이잡은 직접 써 본 것인지,
  #   "양면을 동시에 풀려다"의 주어, AI 자소서·불합격 사유·정량 컷 주장의 확인 방법(경험/추정/자료).
  impact:
    feeling: |-
      (팀 답 2026-10-29, 팀원이 그 상황에서 실제로 느낀 것) "머리가 하얘졌다", "준비한 건 다 말도 못 했다",
      끝나고 남는 후회와 자기 의심.
      (정리본) 그때 한 말·기분: "내 역량은 100인데 면접장만 가면 30이 되는 것 같아",
      "동아리 회장·프로젝트 다 했는데 증명할 게 없네",
      "누구는 자격증부터, 누구는 면접부터 하라는데 뭘 먼저 해야 하지", 막막함·불안·자신감 하락
    # feeling 학생 답 대기: 위 인용들을 누가 언제 한 말인지(E1 팀원이면 E1.quote로, 다른 팀원이면 E2·E3로 옮김).
    measurable: |-
      (정리본) 잃는 시간·횟수·기회: 지원 건당 수십 시간의 자소서, 면접 기회 자체(서류 탈락),
      상·하반기 시즌 한 번(=반년), 토익·자격증 학원비. 기업도 괜찮은 인재를 놓침
      (팀 초안 2026-10-29, 면접 초점일 때 정한 것) 측정할 지표 이름만 둠. 값은 아직 없음.
      - 면접 진출 횟수 대비 최종 합격률
      - 면접 준비에 쓴 시간
      - 정량 전형 통과 뒤 면접에서 탈락한 건수
    # measurable 학생 답 대기: "수십 시간"·"=반년"의 출처 또는 추정 표시, 지표 3개를 정리본(서류 탈락 포함)에 맞게 바꿀지.
    #   팀 결정(2026-10-29): 지금은 지표 이름만 둔다.
  alternatives:
    # (정리본) ⑤ 현재 대안과 ⑥ 단점을 짝지음. 정리본의 A3는 대안 4개가 한 항목에 있어 단점이 대응하는 대로 A3-1~A3-4로 나눔(Agent 구조 정리, 2026-10-29. 문장은 정리본 그대로).
    # why_ours는 2-B에서 채움.
    - how_used: |-
        A1: 자소서를 GPT/Claude에 넣고 다듬기, 예상 질문 뽑아 혼자 거울·카메라 앞에서 연습
      shortcoming: |-
        입력한 내용만 매끈해지고 내 경험을 캐물어 끌어내거나 STAR로 재구성하지 않음.
        기업 맥락·평가 기준이 없어 "잘 썼는지" 판단 불가, 결과물이 남들과 똑같아짐
      why_ours: null
    # A1 학생 답 대기: 거울·카메라 연습 쪽의 단점.
    - how_used: |-
        A2: 유튜브 면접 영상, 인프런 강의, 잡다·원티드 등 AI 모의면접을 시즌에만 사용
      shortcoming: |-
        일반론·일회성. 내 프로젝트에 대한 꼬리질문·압박면접이 아니라 실제 면접에서 막힘. 피드백이 점수화되지 않음
      why_ours: null
    # A2 학생 답 대기: 잡다·원티드 모의면접을 직접 써 봤는지, "피드백이 점수화되지 않음"의 확인 방법.
    - how_used: |-
        A3-1: 친구 면접 스터디
      shortcoming: null
      why_ours: null
    # A3-1 학생 답 대기: 친구 면접 스터디의 단점(정리본 ⑥에 대응하는 문장이 없음).
    - how_used: |-
        A3-2: 취업한 선배·지인에게 "그 회사 어떻게 뽑아?" 묻기
      shortcoming: |-
        신입은 지인이 없어 애초에 불가능한 경우가 많고, 있어도 조언이 주관적.
      why_ours: null
    - how_used: |-
        A3-3: 기사로 회사 방향 분석
      shortcoming: |-
        기사는 대외용이라 실제 채용 의도를 모름.
      why_ours: null
    - how_used: |-
        A3-4: 노션 포폴 템플릿 정리
      shortcoming: |-
        포폴·기록 정리는 귀찮아서 결국 안 하게 됨
      why_ours: null
