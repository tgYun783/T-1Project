# statement: 팀 확정 문장(2026-10-30, 학생이 직접 씀). 캔버스 틀 ②고객 ①상황 ③근본 문제 ④영향 ⑤현재 대안(A1·A2) ⑥단점 순서.
#   ⑥의 "독창성이 없다"며 기업이 부정적으로 봄은 [S8].
statement: >-
  직무 관련 경험이 있는 첫 구직 취준생은 자소서를 쓰거나 면접에서 강점·직무 질문을 받을 때,
  그 경험을 평소 정리해 두지 않아 본인의 역할·기여·선택 이유를 바로 꺼낼 재료가 없기 때문에
  자소서 앞에서 막막해하고 면접에서 제대로 답하지 못한다.
  지금은 범용 AI로 자소서 초안과 예상 답변을 만들거나 서류 기반 AI 모의면접 서비스로 버티지만,
  AI가 만든 답은 외울 문장만 늘릴 뿐 내 경험의 사실은 여전히 비어 있고,
  결과는 비슷해서 "독창성이 없다"며 기업은 부정적으로 본다.
canvas:
  # context: 팀 문구(2026-10-30). 빈도 근거는 S23(S14·S22는 이미 다른 자료라 다음 번호로 등록).
  context: |-
    ① 상황

    언제: 지원 공고를 확인하고 자소서를 작성하는 시점부터 면접을 준비하고 응시하는 시점까지.
      자소서 문항에 맞는 경험과 본인의 기여를 정리할 때,
      그리고 작성한 내용을 면접의 추가 질문에 맞춰 설명해야 할 때 어려움이 드러난다.

    어디서: 자소서를 작성하고 답변을 연습하는 개인 준비 공간과 실제 대면·화상 면접 환경.
      학교·자취방·도서관은 준비 공간의 예시다.

    얼마나 자주: 대학내일20대연구소의 2024년 조사에서 취업 준비 경험자는
      지난 1년간 평균 6.4개 기업에 지원하고 평균 2회의 채용 면접을 경험했다 [S23].
      해당 조사 집단의 평균이며, 첫 취준생만의 수치나 팀원의 실제 횟수는 아니다.

    반복 양상: 공고·자소서 문항 확인 → 직무에 맞는 경험 선택 → 본인의 역할·행동·결과를 정리해 자소서 작성
      → 면접을 앞두고 작성한 경험의 예상 질문과 답변 준비
      → 실제 면접에서 본인 기여·선택 이유 등에 대한 추가 질문에 답변
      → 결과 확인 → 다음 기업 지원 시 경험 선택·서류 작성·면접 준비를 다시 진행.

    실제 사례: E2는 자소서에서 협업 과정과 본인의 기여도를 정리하기 어려웠던 연계형 인턴 지원 사례다.
      E3은 취업 면접에서 본인의 역할을 묻는 꼬리질문에 답변이 막힌 사례다.
      E1은 소프트웨어 마에스트로 선발 면접 사례이므로 취업 면접의 직접 근거와 구분한다.
      세 사례는 단계별 어려움을 보여주며, 같은 사람이 이 전체 과정을 반복했다는 뜻은 아니다.
  customer: |-
    처음 구직하는 취준생(4학년 2학기·졸업예정).
    프로젝트·동아리·대외활동 경험은 있지만 기록을 남기지 않아 말 말고는 증명할 게 없는 사람.
    구직자의 83%가 자기소개서를 쓸 때 막막하다고 답함(사람인, 2025) [S24]
  # 2026-10-30 숫자 해석 정리(학생 요청): 일부 응답자 기준 비율 표기, 서로 다른 조사 인과 연결 제거, E4는 사례로 표시,
  #   "왜 아직 못 고쳤나"를 기존 해법의 출발점 사실로 다시 씀, impact에 S22·S8 손실 추가, S3 "이유 1위"(경험·스펙 없음)는 고객과 맞지 않아 뺌.
# 2026-10-30 오래된 자료 교체(학생 요청): S2 87.7%→S24(2025) 83%, S9(2019)→사람인 2020(1,785명)·S25(2021) 함께 표기,
#   S5(2019, 실무면접 35.2%)는 최신 조사가 없고 S4·S22로 대체돼 삭제, "자포자기 29.1%"(2019만 있음) 삭제,
#   "지원 포기 65.5%"(S3)는 포기 이유 1위가 경험·스펙 없음(S3)이라 우리 원인과 맞지 않아 impact에서 삭제.
  # S2는 2019년 신입·경력 구직자의 자기소개서·이력서 작성 관련 조사다.
  # 아래 핵심 초점은 팀이 정한 문제 해석이며, 모든 취준생의 공통 원인으로 검증한 것은 아니다.
  # E2·E3는 팀이 전달·정리한 사례이고, E4는 팀 밖 한 사람의 인터뷰다.
  root_problem: |-
    ③ 근본 문제

    왜 생기나
    - 경험을 평소 정리하지 않은 점이 서류 작성의 어려움으로 보고됐다.
      신입·경력 구직자 조사에서 자기소개서·이력서 작성이 막막한 이유로
      "스펙·경력 등을 평소에 정리하지 않아서"가 47.3%로 가장 많이 꼽혔다 [S2].

    - E2는 협업 경험이 있었지만 본인의 기여와 해결 과정을 구체적으로 정리하기 어려웠다.
      E3은 외운 대본에 의존해 준비했고, 본인의 역할을 따로 묻는 질문에서 답변이 막혔다 [E2][E3].

    - E4는 AI가 추가한 수치와 표현을 확인하지 않고 제출했다가,
      계산 방법·기간·사용 도구를 묻는 질문에 답하지 못했다.
      반면 직접 작성한 동아리 회계 경험은 꼬리질문에도 설명할 수 있었다 [E4].

    - 팀이 정한 핵심 초점은 "어떤 문장이 내가 근거를 대고 설명할 수 있는 내용인지 스스로 구분하지 못함"이다.
      경험을 정리하는 어려움에 더해, 완성된 자소서 문장을 실제 행동·판단·수치의 근거와 대조해
      제출 전에 설명 가능 여부를 점검하는 문제에 집중한다.

    왜 아직 못 고쳤나
    - 경험 정리·자소서 작성 서비스와 답변 기반 꼬리질문 서비스는 이미 제공되고 있다 [S17][S18][S20].
      따라서 필요한 기능이 시장에 없다고 설명하기보다, 실제 사용 과정에서 남은 어려움을 살펴본다.

    - E4는 AI 초안과 예상 질문을 활용하고 답변을 외웠지만,
      준비한 질문에는 수치의 계산 근거를 묻는 내용이 없었고 제출 전에도 이를 확인하지 않았다.
      이 사례에서는 글과 예상 답변의 완성이 문장별 근거 점검으로 이어지지 않았다 [E4].

    - 이후 E4는 문장마다 실제 있었던 일인지, 질문받으면 답할 수 있는지를 직접 메모했다.
      그러나 혼자서는 어디까지 확인해야 하는지 모르겠고 점검 시간도 늘었다고 말했다.
      현재 확인된 미해결 부담은 이 사례의 설명 가능 여부 판단과 직접 점검에 드는 수고다 [E4].
  impact:
    feeling: |-
      ④ 그때 한 말·기분

      - E1(팀원 본인): 면접에서 떨리고 머리가 하얘졌으며, 준비한 내용을 충분히 말하지 못한 뒤 자기 의심을 느꼈다.
        "내 역량은 100인데 면접장만 가면 30이 되는 것 같아. 준비한 건 다 말도 못 했어."

      - E2(지인의 경험을 팀이 정리): 협업 노력을 구체적인 근거로 보여 주기 어렵다는 무력감을 느꼈다.
        자소서 작성에 시간을 쓰고도 결과가 좋지 않자 허탈함과 초조함을 느꼈고,
        다른 기업의 지원 기회까지 놓쳤다는 부담이 남았다.

      - E3(친구의 경험): 본인의 역할을 묻는 추가 질문에서 머리가 하얘지고 답변이 막혔다.
        이후 면접에 대한 두려움이 커져 지원 자체도 두려워하게 됐다고 보고됐다.

      - E4(팀 밖 인터뷰): 한 문장에서 답변이 막힌 뒤,
        면접관이 다른 문장까지 의심하는 것처럼 느꼈다고 말했다.
        "직접 겪은 건 말이 되는데, AI가 다듬은 문장은 제 말이 아니라서 거기서 더 들어가면 막히더라고요."
    measurable: |-
      ④ 잃은 시간·횟수·기회

      - 작성에 쓴 시간: 팀이 정리한 E2 기록에서는 자소서 한 건을 며칠 동안 붙잡고 작성했다.
        정확한 소요 시간은 확인되지 않았다.

      - 놓친 지원 기회: E2는 해당 자소서를 작성하는 동안
        같은 주에 마감한 다른 기업 두 곳의 지원서를 작성하지 못했다고 보고됐다.
        제출한 기업에서는 서류 불합격했으나, 불합격 원인은 확인되지 않았다.

      - 추가 점검 부담: E4는 면접 이후 AI 초안의 문장마다 실제 경험인지,
        질문받으면 설명할 수 있는지 직접 메모하기 시작했다.
        이 점검으로 작성 시간이 두 배로 걸린다고 보고했다.
        이는 개인의 자가보고이며, 비교 기준과 실제 소요 시간은 미측정이다.

      - 보조 자료: 2017년 KT 대학생 활동단 255명 조사에서는
        자소서 한 개 작성에 평균 7시간이 소요됐다고 보고됐다 [S10].
        과거 조사 집단의 작성 시간이며, 전부를 불필요하게 잃은 시간으로 계산하지 않는다.

      지표(이름만, 값은 아직 없음, 팀 결정 대기):
      - 서비스 안: 자소서 문장 중 꼬리질문에 근거를 댄 비율, 제출 전 점검에 쓴 시간
      - 서비스 밖: 면접 진출 대비 최종 합격률, 면접 준비에 쓴 시간
  alternatives:
    # 2026-10-30 대안 재정리(학생 요청): 근본 문제 Why 5를 잣대로 "제출 전에 내가 설명할 수 있는 문장인지 점검해 주는가, 비용·접근성은?"으로 통일.
    #   A1 "기업은 부정적" 단정은 S26(2025, 의견이 갈림)으로 고침, 다른 집단 통계(S2) 연결 제거. A2 사용률은 국내 조사 없음을 밝힘.
    #   A3 첨삭은 S27(2026)로 받치고 단점을 비용으로. A4는 "확인 안 됨"이 단점이 아니라서 비움. why_ours는 팀원 수정안 그대로.
    - how_used: |-
        A1: 범용 AI로 자소서 초안·예상 질문 만들기
        취준생의 98%가 취업 준비에 AI를 쓰고, 자소서 초안 작성(84%)·면접 예상 질문 생성(67%)에 쓴다(2026) [S6]
      shortcoming: |-
        기업 인식은 갈린다(부정 33.3%, 긍정 29.4%, 모름 37.3%). 부정 이유 1위는 "지원자의 진정성을 확인하기 어렵다"(78.4%)다(2025) [S26].
        AI 작성이 확인되면 불이익을 준다는 대기업도 65.4%다 [S8].
        (사례 E4) AI가 실제보다 부풀린 수치를 넣었고, 확인 없이 냈다가 면접 추가 질문에 근거를 대지 못했다 [E4 Q2].
        AI로 뽑은 예상 질문에는 근거를 묻는 질문이 없었다 [E4 Q5].
        (간접) AI로 글을 쓴 사람은 자기 글을 정확히 인용하기 어려워했다 [S14].
      why_ours: |-
        (설계) 자소서의 주장에 연결된 사실을 사용자에게 묻고, 설명된 부분과 보완할 부분을 저장한다.
        답변 문장을 대신 완성하는 것보다 사용자가 경험을 설명하고 다른 각도의 질문으로 다시 연습하는 흐름에 집중한다.
        범용 AI보다 효과적인지는 동일한 경험으로 비교 검증한다.
    - how_used: |-
        A2: 서류 기반 AI 모의면접 서비스
        사람인·코드잇 어센트·패스잇·면접도우미가 이력서·자소서·공고로 질문과 꼬리질문을 만든다 [S11][S12][S16][S19][S20].
        (사용률 확인 안 됨) 국내 취준생의 이용률 조사는 찾지 못했다.
      shortcoming: |-
        이미 쓴 서류에서 질문을 만든다 [S11][S12][S16][S19][S20].
        (추론) 면접을 준비하는 단계에서 쓰게 되므로, 이미 제출한 문장은 고칠 수 없다.
        사람인은 정가 1회 27,500원이다 [S11].
      why_ours: |-
        (설계) 자소서에서 설명할 사실을 찾고, 그 사실을 면접 질문·답변·피드백·재연습에 연결한다.
        한 번의 면접 결과보다 같은 경험을 다른 질문에도 설명할 수 있도록 보완하는 과정을 제공한다.
        이 연결 과정이 기존 서비스에 없는 독점 기능이라고 단정하지 않는다.
    - how_used: |-
        A3: 합격 자소서 참고·유료 첨삭
        20대 취준생의 42%가 최근 1년간 유료 취업 서비스를 이용했고, 이용·고민한 서비스 1위는 자소서·이력서 첨삭(59%)이다(2026) [S27].
        자소서가 어려울 때 합격 자소서를 참고한다는 응답은 50.3%였다(2018) [S3].
      shortcoming: |-
        첨삭은 사람이 직접 물어봐 주지만 비용이 든다. 자소서 첨삭 4만 원부터(20만 원 넘는 경우도 있음), 모의면접은 시간당 4만5천~5만 원 [S27].
        이용 이유에 "혼자 준비하면 방향 잡기 어려움"이 26%다 [S27].
        (가설) 합격 자소서를 참고해도 내 경험은 정리되지 않는다.
      why_ours: |-
        (설계) 혼자서도 반복 연습하고, 이전 답변에서 부족했던 설명을 다음 연습에 이어서 사용할 수 있게 한다.
        실제 면접관이나 현직자의 피드백을 대체한다고 주장하지 않는다.
    # A4 (2026-10-30 추가): 소개 페이지로 확인한 기능만 적음. why_ours는 팀이 정해야 해서 null.
    - how_used: |-
        A4: 취준 올인원 AI 서비스(경험 정리 → 자소서 → 면접)
        커리어마이징 [S17], TIO [S18] (기능은 소개 페이지 기준)
      shortcoming: null
      # 직접 써 본 뒤 채운다: AI가 먼저 질문해서 경험을 끌어내는가, 제출 전 문장별 점검이 있는가, 꼬리질문·음성이 있는가.
      why_ours: null
