    - {id: D3, name: 면접 꼬리질문, basis: F6}
    - {id: D4, name: 질문 건너뛰기·다시 듣기·면접 종료, basis: F7}
    - {id: D5, name: 면접 중 카메라 화면, basis: F9}
    - {id: D6, name: 면접 결과 화면, basis: F8}
    - {id: D7, name: 면접 결과로 경험 카드 보완, basis: F8}
    - {id: D8, name: 자기소개서 수정 제안, basis: F8}
