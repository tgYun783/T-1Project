# T1 팀 문제정의. 종이 캔버스(2026-10-29, 팀원 JW·TK·HN·SG·HE)와 팀이 만든 초안(2026-10-29)에서 옮김.
# "(팀 초안)" 표시는 종이에는 없고 팀이 초안으로 적은 내용이다. 2-A에서 다지면서 고친다.
# 종이와 초안에 없는 내용은 null 또는 []로 둔다.
# 최신 정리본(2026-10-29, 팀이 최신으로 확정): 캔버스 ①~⑥을 canvas에 옮김. "(정리본)" 표시가 이 내용이다.
# 이전 초점(2026-10-29): 정량 전형(서류·인적성·코테)을 통과한 뒤 면접 정성평가에서 당황하는 구직자.
#   이유: 서류 쪽은 비슷한 서비스가 많지만 면접 쪽은 그렇지 않아 면접에 집중하는 게 경쟁력이 있다고 봄. Claude로 검색해 확인, 출처는 없음(팀 판단).

# statement: 팀이 최신 정리본 기준으로 확정한 한 문장(2026-10-29).
statement: >-
  정량적 스펙 중심으로 준비해 온 취준생이 자신의 구체적인 기여도와 문제 해결 역량을
  논리적으로 설명하지 못해, 서류 작성을 어려워하고 실전 압박 면접에서 무너지는 문제
canvas:
  context: |-
    (정리본) 기존 종이 내용 + 보강
    시간: 4학년 2학기·졸업예정자·취준생. 상/하반기 공채 시즌, 공고가 뜬 뒤 ~ 면접 직전에 집중 발생
    장소: 학교, 자취방, 부트캠프 … 어디서든
    반복 양상 (1인 기준): 공고 확인 → 직무 보고 "내 경험 중 뭘 녹일지" 고민 → 템플릿 지원서(사진·경험·프로젝트·포폴·자소서) 작성
      → 서류 → AI역검/인적성/코테 → 1·2차 면접(실무·임원) → 결과 확인 → 다음 공고로 반복
    특징: 채용 시즌에 몰림, 병렬 지원(난사 / 직무 저격 / 특정 회사·기업유형), 높은 매일 수요.
      경력이 없어 경험을 쌓고 싶어도 뽑아주지 않는 순환 구조
  customer: |-
    구직자
    회사
    (정리본)
    1차 고객: 구직자 — 처음 구직하는 취준생
      4학년 2학기, 프로젝트 7~8개·해커톤·동아리·대외활동은 했지만 블로그/기록이 없어
      "내가 한 걸 말 말고는 증명할 수 없는" 사람
      서류는 붙는데 면접에서 떨어지거나, 경험은 많은데 직무에 맞게 어필할 줄 모르는 사람
      (확장) 취업 정보 과잉으로 뭘 먼저 할지 모르는 2~3학년
    2차(보조): 회사 — 서류가 다 비슷해 실제 역량을 가려내기 힘든 채용 담당자.
      단, 멘토 조언대로 무게중심은 취준생 한쪽에 둠
    (팀 답 2026-10-29) 무게중심을 구직자에 둔 이유: 구직자가 팀 상황에 더 가깝고 공감할 수 있어서.
      팀원들도 각자 면접 때문에 고민한 경험이 있다. 팀 밖에서 겪은 사람은 학생 답 대기.
  root_problem: |-
    (정리본)
    왜 생기나
    - 경험은 있는데 구조화·증명이 안 됨 — 활동 당시 기록을 남기지 않고, 면접에서 "상황-과제-행동-결과"로 설명하는 훈련이 없음.
      AI가 써준 자소서는 길고 다 비슷해 변별이 사라짐
    - 정보 비대칭 — 기업은 원하는 역량·인재상·내부 의도를 공개하지 않고 불합격 사유도 알려주지 않음.
      신입은 직무 인맥이 없어 지인 추천·커피챗 같은 "사람 통로"가 막혀 있음
    - 기업은 서류로 실제 역량을 판별 못 해 정량 컷(학점·어학·자격증)으로 거르고, 신입은 레퍼런스 체크도 불가
      → 정성 역량이 평가 테이블에 올라가지 못함
    왜 아직 못 고쳤나
    - 기존 서비스(인프런·잡다·원티드·하이잡)는 일반 강의·일회성 모의면접이라 "내 경험"에서 출발하지 않고,
      시즌에만 쓰여 데이터가 쌓이지 않음
    - 범용 AI(GPT/Claude)는 넣은 것만 다듬을 뿐 캐묻지 않음 — 재료(경험) 자체를 끌어내는 단계가 없음
    - 기업·구직자 양면을 동시에 풀려다 어느 쪽도 뾰족하게 정의되지 못함
  impact:
    feeling: |-
      (팀원이 그 상황에서 실제로 느낀 것, 2026-10-29 확인) "머리가 하얘졌다", "준비한 건 다 말도 못 했다",
      끝나고 남는 후회와 자기 의심.
      (정리본) 그때 한 말·기분: "내 역량은 100인데 면접장만 가면 30이 되는 것 같아",
      "동아리 회장·프로젝트 다 했는데 증명할 게 없네",
      "누구는 자격증부터, 누구는 면접부터 하라는데 뭘 먼저 해야 하지", 막막함·불안·자신감 하락
    measurable: |-
      (정리본) 잃는 시간·횟수·기회: 지원 건당 수십 시간의 자소서, 면접 기회 자체(서류 탈락),
      상·하반기 시즌 한 번(=반년), 토익·자격증 학원비. 기업도 괜찮은 인재를 놓침
      ("수십 시간"의 출처·추정 여부는 학생 답 대기)
      (팀 초안) 측정할 지표만 정함. 값은 아직 없음. 팀 결정(2026-10-29): 지금은 지표 이름만 둔다.
      - 면접 진출 횟수 대비 최종 합격률
      - 면접 준비에 쓴 시간
      - 정량 전형 통과 뒤 면접에서 탈락한 건수
  alternatives:
    # ⑤ 현재 대안 A1~A3는 팀이 수정한 문구(2026-10-29)로 교체. ⑥ 단점(shortcoming)은 이전 정리본 그대로. why_ours는 2-B에서 채움.
    - how_used: |-
        A1: 범용 텍스트 AI 및 셀프 대본 연습 (Generative AI & Self-Practice)
        - 구체적 수단: ChatGPT, Claude 등 범용 생성형 AI, 스마트폰 카메라/거울
        - 유저 행동: 유저가 직접 쓴 초안을 입력하여 문장을 다듬고(윤문), AI가 뽑아준 예상 질문 답변을 작성한 뒤 카메라 앞에서 대본을 암기하며 혼자 연습함.
      shortcoming: |-
        입력한 내용만 매끈해지고 내 경험을 캐물어 끌어내거나 STAR로 재구성하지 않음.
        기업 맥락·평가 기준이 없어 "잘 썼는지" 판단 불가, 결과물이 남들과 똑같아짐
      why_ours: null
    # A2 단점: 기존 "피드백이 점수화되지 않음"은 확인 방법이 학생 답 대기라 뺌(2026-10-29). 새 A2 설명에 맞춰 다시 씀
    - how_used: |-
        A2: VOD 학습 콘텐츠 및 정형화된 1:1 AI 모의면접 (Legacy EdTech & VOD)
        - 구체적 수단: 유튜브 합격 팁 영상, 인프런/클래스101 면접 강좌, 잡다(JOBDA)·원티드·하이잡 등 기존 AI 면접 플랫폼
        - 유저 행동: 공채 시즌 직전에 집중적으로 일반론적 면접 답변 공식을 학습하고, 1:1 단방향 녹음 형태의 정형화된 모의면접을 일회성으로 수행함.
      shortcoming: |-
        일반론적 답변 공식을 배우고 1:1 단방향 녹음으로 일회성 연습만 해서, 내 프로젝트에 대한 꼬리질문·압박면접이 아니라 실제 면접에서 막힘
      why_ours: null
    - how_used: |-
        A3: 인적 네트워크 멘토링 및 정적 템플릿 작성 (Human Network & Static Templates)
        - 구체적 수단: 취업 스터디, 지인/선배 커피챗, 기업 뉴스 기사 스크랩, 노션(Notion) 포트폴리오 템플릿
        - 유저 행동: 지인이나 선배를 통해 개별 기업의 족보성 정보를 구두로 전달받고, 스터디원 간 주관적 피드백을 교환하며 정형화된 포트폴리오 양식을 채움.
      shortcoming: |-
        신입은 지인이 없어 애초에 불가능한 경우가 많고, 있어도 조언이 주관적.
        기사는 대외용이라 실제 채용 의도를 모름. 포폴·기록 정리는 귀찮아서 결국 안 하게 됨
      why_ours: null
personas: []
experiences:
  - id: E1
    when: 2026년 초
    what_happened: >-
      소프트웨어 마에스트로 면접. 떨려서 제대로 답을 못 하고 꼬리질문에 막혔다.
      준비한 답만 외우다 보니 꼬리질문에 경험을 못 꺼냈다. 처음 해 보는 면접이라 어떻게 진행되는지 몰랐다.
    workaround: null
    feeling: 떨렸다
    quote: null
    source: 팀원 본인 경험(2026-10-29 대화). 막힌 질문 내용·그때 한 말·끝나고 한 일은 학생 답 대기
  - id: E2
    when: 약 1년 전(2026-10-29 기준)
    what_happened: >-
      국내 주요 콘텐츠·IT 플랫폼 기업의 '서비스 기획(PM) 및 콘텐츠 에디터' 연계형 인턴 공고.
      포트폴리오 파일 제출보다 자기소개서의 '협업 과정 및 갈등 해결 에피소드'와 '구체적 기여도(%)'를 정밀하게 요구한 서류 전형.
      자기소개서 문항 "팀 프로젝트 중 이견을 조율하고 문제를 해결한 과정과 본인의 구체적인 기여도를 서술하시오" 앞에서 막혔다.
      어떤 답변이 내 경험을 살리면서 좋은 자기소개서가 될지 몰랐다.
      쌓아 온 과정을 정제하고 기업에 맞춰 자소서를 매번 각각 작성하는 일이 어려웠다.
    workaround: >-
      어떻게든 써서 냈지만 좋은 성과가 따라주지 않았다.
      자소서를 직접 작성하는 동안 다른 기업에 서류를 넣을 시간이 부족했다.
      (팀이 지인 이야기를 듣고 정리) 팀장을 맡아 갈등을 중재했지만 제출할 회의록·데이터가 없어
      상투적인 문장("경청하고 소통해서 잘 해결했다")을 쓸 수밖에 없었다. 며칠 동안 붙잡고 겨우 냈지만 서류에서 불합격했고,
      그러느라 같은 주에 마감이던 다른 기업 두 곳은 서류를 써 보지도 못했다.
    feeling: |-
      (팀이 지인 이야기를 듣고 정리)
      문항 앞에서 막혔을 때: 억울함과 깊은 자괴감, 실제 협업 노력을 객관적인 증거로 증명하지 못하는 무력감
      결과가 좋지 않았을 때: 허탈함과 심한 초조함, 한 공고에 시간을 다 빼앗겨 다른 기업 서류 기회까지 날려버린 공포
    quote: null
    source: 팀원의 지인(4학년 취준생)의 경험. 팀원이 지인에게 직접 들음(2026-10-29 대화). 지인이 한 말 그대로의 인용은 없음(팀이 다듬은 말이라 quote에 넣지 않음)
  - id: E3
    when: 몇 달 전(2026-10-29 기준)
    what_happened: >-
      마케팅/영업 직무 지원자. 대기업 실무진 다대일 압박 면접.
      "성과가 좋았다고 적혀 있는데, 여기서 본인의 역할을 빼도 전체 결과에 차이가 없지 않나?"라는 압박 꼬리질문을 받았다.
      원인(팀이 친구 이야기를 듣고 정리한 말, 친구가 직접 한 말은 아님): 외운 대본에 의존해 성과(Result)만 늘어놓았을 뿐, 압박 상황에서 내 주도적 행동(Action)을
      말로 즉석에서 풀어내는 실전 음성 순발력 및 담력 훈련이 안 되어 있었다.
    workaround: >-
      외운 대본에 의존해 성과만 늘어놓았다. 외운 범위를 벗어나자 답변이 중단됐다.
    feeling: >-
      머리가 하얗게 비었다. 면접 울렁증이 심해져 이후 지원 자체를 두려워하게 됐다.
    quote: >-
      "외운 대본에서 한 발짝만 벗어나니까 진짜 입도 뻥긋 못 하겠더라. 면접관이 '거기서 본인 빼도 결과는 똑같았을 것 같은데요?' 하고 딱 찌르는데,
      순간 머리가 새하얘지면서 어버버하다 정적만 흘렀어. 외운 문장 말고는 내 진짜 행동을 말로 바로 뱉어내는 실전 훈련이 전혀 안 되어 있다는 걸 깨닫고 나니까,
      이젠 면접장에 들어가는 것 자체가 너무 무서워."
    source: 친구의 경험. 팀이 "인터뷰/실제 사례 4"로 전달함(2026-10-29 대화). 정확한 면접 시점은 "몇 달 전"까지만 확인됨
# 다른 팀원들도 각자 면접 때문에 고민한 경험이 있다(2026-10-29). 언제·어느 면접인지는 학생 답 대기.
sources: []
five_whys:
  symptom: 취준생이 서류 작성과 면접 꼬리질문에서 자신의 구체적 기여도를 설명하지 못하고 좌절함.
  whys:  # 팀 답 그대로(2026-10-29). 이전 E1 기준 5 whys는 git 기록에 있음
    - 외운 대본만 말하려 할 뿐, 경험의 핵심 행동(Action)과 성과(Result)를 논리적으로 구조화하지 못하기 때문.
    - 활동 당시 기록을 남기지 않았고, 파편화된 기억을 STAR 구조로 정제하는 훈련을 해본 적이 없기 때문.
    - 경험 파편을 대화로 캐물어 STAR 데이터로 정제해 주는 대화형 경험 스캐너 도구를 사용하지 않기 때문.
    - 기존 AI 도구들은 유저가 쓴 글만 다듬어줄 뿐, 아무것도 없는 상태에서 경험 재료를 끌어내는 인터랙션이 없기 때문.
    - "근본 문제: 경험을 문제 해결 논리로 정제하는 스캔 프로세스와, 다대일 압박 속에서 내 기여도를 말로 풀어내는 실전 음성 훈련 환경의 부재."
# 팀 답 그대로(2026-10-29). 세 경로 모두 팀이 "우리가 개발할 대화형 자소서 및 압박 면접 훈련 웹서비스"의 단계로 선택함.
solution_paths:
  - path: |-
      경험 스캐너 (발굴 및 구조화)
      - 유저가 빈칸을 채우는 것이 아니라, AI 챗봇이 "당시 갈등 상황은 어땠나요?", "본인이 낸 아이디어는 무엇이었나요?" 등 꼬리질문을 던지며 과거 프로젝트의 파편화된 기억을 대화로 캐묻는다.
      - 이 대화 로그를 바탕으로 AI가 유저의 경험을 STAR(상황-과제-행동-결과) 구조의 객관적 데이터로 자동 정제하여 개인 '경험 포트폴리오'로 아카이빙한다.
    status: chosen
    reason: null
  - path: |-
      맞춤형 자소서 빌더 (증명 및 문서화)
      - 정제된 STAR 데이터를 활용해 지원 기업의 직무 공고와 자소서 문항에 최적화된 초안을 도출한다.
      - "소통하여 해결했다"는 상투적 표현 대신, 추출된 데이터 기반의 '구체적 기여도(%)와 문제 해결 과정'이 명확히 담긴 차별화된 결과물을 제공한다.
    status: chosen
    reason: null
  - path: |-
      내 경험 기반 음성 모의면접 (실전 방어 훈련)
      - 시중에 있는 뻔한 일회성 면접 질문(예: "우리 회사 왜 지원했나요?")을 배제한다.
      - AI 면접관이 유저의 '자소서와 정제된 경험 데이터'의 맹점을 파고드는 다대일 압박 꼬리질문(예: "거기서 본인 빼도 결과는 똑같았을 것 같은데요?")을 실시간 음성으로 던진다.
      - 유저가 즉석에서 마이크로 답변하는 훈련을 반복시켜, 대본 암기 습관을 부수고 실전 담력과 논리적 순발력을 기른다.
    status: chosen
    reason: null
# reason(고른 이유)은 팀이 따로 말하지 않아 null로 둠. 학생 답 대기.
# 통찰 3개를 claim에 함께 적음(팀 답 그대로, 2026-10-29). evidence는 팀이 말하지 않아 비워 둠(경험 id·sources id는 학생 답 대기).
insight:
  claim: |-
    1. 경험의 부재가 아니라 '추출과 구조화'의 부재다: 취준생이 서류와 면접에서 막히는 근본 원인은 경험 자체가 부족해서가 아니다. 프로젝트가 끝난 후 과정 데이터(로그)가 휘발되어, 파편화된 기억을 면접관이 납득할 수 있는 '문제 해결 논리(STAR)'로 조립하는 방법을 모르기 때문이다.
    2. 글을 다듬는 AI가 아니라, '재료를 캐묻는 AI'가 필요하다: 빈 워드 창 앞에서 막막해하는 신입 구직자에게 완성된 글을 윤문해 주는 기존 범용 AI(GPT, Claude)는 한계가 명확하다. 선행되어야 할 것은 유저의 숨겨진 기여도와 갈등 중재 과정을 집요하게 묻고 끌어내 주는 '능동적인 인터랙션'이다.
    3. 대본 암기는 압박 면접의 독(毒)이다: 면접 울렁증과 "머리가 하얘지는" 현상은 외운 대본에서 한 발짝만 벗어나면 대응하지 못하기 때문에 발생한다. 텍스트 시나리오가 아닌, 내 실제 행동(Action)을 즉석에서 '음성'으로 뱉어내는 실전 방어 훈련만이 실효성 있는 대안이다.
  evidence: null
  design_decision: >-
    우리가 개발할 '대화형 자소서 및 압박 면접 훈련 웹서비스'는 위 통찰을 바탕으로 3단계(경험 스캐너 → 맞춤형 자소서 빌더 → 내 경험 기반 음성 모의면접)의 논리적 해결책을 제공한다.
features:
  # 출처: 팀원 설계 docs/interview-design.md(2026-10-29)와 학생 답(2026-10-29 밤). 설계에 없는 것은 "학생 답 대기"로 주석.
  # 사용자가 넣는 것 → 저장·보이는 결과 → 관찰할 수 있는 완료 조건.
  - id: F1
    name: 회원가입·로그인
    input: 이메일·비밀번호
    output: 취준생 계정이 만들어지고 로그인 상태가 된다. 역할은 취준생 하나. 이력서·자기소개서·면접 기록은 계정별로 따로 남는다.
    done: 아이디/비밀번호로 바로 로그인되고, 다시 접속해도 내 이력서·자기소개서·면접 기록이 그대로 보인다. 로그인 전에는 로그인 필요 화면이 열리지 않는다.
  # F1 역할: 취준생 하나만(학생 답 2026-10-29). 흐름 account·시드 계정 역할 이름으로 그대로 씀.
  - id: F2
    name: 이력서 템플릿 입력
    input: >-
      (학생 답 2026-10-30) 먼저 가진 이력서 내용을 텍스트 폼에 붙여 넣고(기본 텍스트, 필수),
      그 아래에서 9개 항목(1분 자기소개, 직무 관련 성공경험, 직무를 위해 준비한 사항, 지원동기, 입사 후 포부, 성격의 장단점,
      위기 극복 경험, 성장과정, 팀워크 및 협업경험)을 태그로 골라 고른 태그마다 생긴 칸에 추가로 글 입력(태그는 0개 가능)
    output: 기본 텍스트와 고른 태그별 글이 내 이력서로 저장된다.
    done: >-
      기본 텍스트를 넣고 태그 2개를 골라 채워 저장하면 다시 접속해도 같은 기본 텍스트·태그·내용이 보인다.
      기본 텍스트가 비거나 고른 태그의 칸을 비운 채 저장하면 경고가 보이고 저장되지 않으며 다시 입력하게 된다.
      저장 뒤 내용 수정과 태그 추가가 된다. (학생 답 2026-10-29·30. "기본 텍스트 필수·태그 선택"은 Agent 기본값, 팀 확인 대기)
  - id: F3
    name: 자기소개서 초안 생성
    input: 저장된 내 이력서(F2) → "초안 만들기"
    output: AI가 이력서 내용으로 자기소개서 초안(글)을 만들어 보여 주고 저장한다. 사용자가 입력하지 않은 경험·성과는 넣지 않는다.
    done: 초안이 화면에 보이고 내 자기소개서 목록에 저장돼 다시 접속해도 보인다. AI 호출이 실패하면 에러가 표시되고 초안은 저장되지 않는다.
  # F3 (학생 답 2026-10-29) AI 호출 실패 시 에러를 표시한다. 학생 답 대기: 초안을 사용자가 고칠 수 있는지, 문항별인지 한 덩어리인지.
  - id: F4
    name: 기존 자기소개서 등록
    input: 이미 쓴 자기소개서 글 붙여넣기
    output: 내 자기소개서로 저장된다. 자기소개서는 여러 개 둘 수 있다.
    done: 붙여 넣고 저장하면 자기소개서 목록에 보이고 다시 접속해도 그대로다. 빈 글은 저장되지 않고 이유를 보여 준다.
  # F4 (학생 답 2026-10-29) 자기소개서는 여러 개 둘 수 있다. 빈 글 저장 안 됨 확인.
  - id: F5
    name: 모의면접 시작(본질문 생성)
    input: 내 자기소개서 하나 선택 → "면접 시작"
    output: >-
      AI 호출 한 번으로 본질문 4개(실무 면접관 2·임원 면접관 2)를 자기소개서에 맞춰 만들고, 질문마다 면접관·확인 목적·근거 자기소개서 문장을 함께 저장한다.
      순서는 세션 생성 때 한 번 랜덤으로 정해 저장한다. 생성에 실패하면 기본 질문 템플릿을 쓰고 그 상태를 기록한다.
      첫 질문이 화면에 글자로 보이고 TTS로 읽어 준다.
    done: 면접 시작 뒤 첫 질문(면접관 이름 포함)이 글자로 보이고, 새로고침해도 같은 질문·같은 순서다.
  - id: F6
    name: 답변 제출(음성 기본, 글자도 가능)
    input: 음성 답변(브라우저에서 녹음 → 우리 서버 → Gateway의 OpenAI STT 모델로 전사 → 전사 내용을 확인·수정 뒤 제출) 또는 글자 답변
    output: >-
      답변이 저장되고, AI 호출 한 번으로 현재 질문의 확인 상태(설명됨 / 추가 확인 필요 / 모름·경험 없음)를 갱신해
      꼬리질문(그 본질문의 면접관이 계속, 본질문당 최대 2개) 또는 다음 본질문으로 넘어간다.
      전체 질문 최대 12개·진행 최대 12분에 닿으면 현재 답변을 마친 뒤 종료한다. 답변에 점수를 매기지 않는다.
    done: 글자로 답을 내면 다음 질문(꼬리질문 또는 다음 본질문)이 글자로 보이고, 질문·답변 기록에 방금 답이 한 줄 추가된다.
  # F6 전사 방식(학생 답 2026-10-29): OpenAI STT 모델. 키는 서버만 읽으므로 프런트가 OpenAI를 직접 부르지 않고 서버 경유(Gateway). 모델 이름(whisper-1 / gpt-4o-transcribe)은 3단계에서 Gateway 목록 확인 뒤 정함.
  # F6 (학생 답 2026-10-29) 전사 결과가 비면 다시 말하기 안내를 보여 준다.
  - id: F7
    name: 질문 건너뛰기·면접 종료
    input: 화면의 "건너뛰기" 버튼 또는 "면접 종료" 버튼
    output: 건너뛰면 다음 본질문으로 간다. 종료하면 종료 사유가 기록되고 결과 화면으로 간다. 질문 다시 듣기·음성 인식 재시도는 질문 수에 넣지 않는다.
    done: 어느 질문에서든 "면접 종료"를 누르면 결과 화면이 열리고 종료 사유가 기록돼 있다.
  - id: F8
    name: 면접 결과와 자기소개서 보완
    input: 끝난 면접
    output: >-
      종합 점수 없이 (1) 질문·답변 기록(면접관·질문 목적 포함) (2) 구체화된 경험(역할·선택 이유·결과 중 새로 설명한 내용)
      (3) 아직 보완할 항목 최대 3개(해당 답변과 연결) (4) 자기소개서 수정 제안(어떤 문장을 왜 바꾸는지)을 보여 준다.
      사용자가 수정 제안을 승인하면 자기소개서에 반영되고, 거절하면 반영하지 않고 그대로 둔다. 지난 면접 결과는 나중에 다시 볼 수 있다.
    done: 결과 화면에 질문·답변 기록과 보완 항목이 보이고, 수정 제안을 승인하면 자기소개서 본문이 바뀐 채 저장돼 다시 접속해도 유지된다.
  # F8 (학생 답 2026-10-29) 거절하면 그대로 둠, 지난 결과 다시 보기 가능.
  - id: F9
    name: 면접 중 내 카메라 화면
    input: 브라우저 카메라 권한 허용 여부
    output: 면접 화면에 내 카메라 영상을 보여 주기만 한다(저장·전송 없음). 카메라가 없거나 꺼져 있으면 그 자리에 검은 화면이 보인다.
    done: 카메라를 허용하면 면접 화면에 내 영상이 보이고, 카메라가 없는 브라우저(자동 테스트 포함)에서는 검은 화면이 보이며 면접은 그대로 진행된다.
  # F9 출처: 학생 답 2026-10-29(플랫폼 이유에서 나온 UI 요소).
