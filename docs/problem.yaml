five_whys:
  # 2026-10-30 근거에 맞춰 교체. 이전 Why 3(경험 스캐너를 안 써서)은 해법이 원인 자리에 든 순환 논리라 뺌.
  # 2026-10-30 학생 요청: Why 1~3 유지. 기존 Why 4("설명해 보는 단계가 빠져 있다")는 Why 5와 겹쳐 근거 있는 문장(E4·S22)으로 바꿈.
  #   Why 5(근본 문제)는 메타인지. "스스로 구분하지 못한다"의 근거는 아직 E4 한 명이라 가설로 둔다.
  symptom: 취준생이 면접 꼬리질문에서 자기 자소서의 경험과 기여를 설명하지 못한다(면접 후회 이유 "답변을 제대로 하지 못해서" 46%, 2020) [S9][E4 Q2]
  whys:
    - 문항·질문에 맞는 경험을 바로 꺼내지 못해서(자소서 쓸 때 막막 83%, 2025) [S24]
    - 경험을 평소에 정리해 두지 않아서(47.3%) [S2]
    - >-
      정리하는 대신 AI 초안이나 합격 자소서로 문장을 채워서(84% [S6], 합격 자소서 참고 50.3%·2018 [S3]).
      마감에 몰리면 회사당 30분도 못 쓴다 [E4 Q1]
    - >-
      그래서 자소서에 내가 근거를 댈 수 없는 문장이 섞이고(AI가 부풀린 "15%") [E4 Q2],
      면접관은 이런 문장을 구체적 추가 질문으로 확인한다(78.6%) [S22]
    - >-
      (팀이 정한 핵심 초점) 어떤 문장이 내가 근거를 대고 설명할 수 있는 내용인지
      스스로 구분하지 못하고, 제출 전에 설명 가능 여부를 점검하는 데 어려움을 겪는다 [E4].
# 팀 답 그대로(2026-10-29). 세 경로 모두 팀이 "우리가 개발할 대화형 자소서 및 압박 면접 훈련 웹서비스"의 단계로 선택함.
# 2026-10-30 학생 답: 제출 전 문장 점검은 새 해법이 아니라 경로 2(자소서 빌더)의 확인 단계로 본다. 경로 3(음성 모의면접)의 보류/선택 유지는 팀 결정 대기(docs/scope-open-items.md 7번).
solution_paths:
  - path: |-
      경험 스캐너 (발굴 및 구조화)
      - 유저가 빈칸을 채우는 것이 아니라, AI 챗봇이 "당시 갈등 상황은 어땠나요?", "본인이 낸 아이디어는 무엇이었나요?" 등 꼬리질문을 던지며 과거 프로젝트의 파편화된 기억을 대화로 캐묻는다.
      - 이 대화 로그를 바탕으로 AI가 유저의 경험을 STAR(상황-과제-행동-결과) 구조의 객관적 데이터로 자동 정제하여 개인 '경험 포트폴리오'로 아카이빙한다.
    status: chosen
    reason: null
  - path: |-
      맞춤형 자소서 빌더 (증명 및 문서화)
      - 정제된 STAR 데이터를 활용해 지원 기업의 직무 공고와 자소서 문항에 최적화된 초안을 도출한다.
      - "소통하여 해결했다"는 상투적 표현 대신, 추출된 데이터 기반의 '구체적 기여도(%)와 문제 해결 과정'이 명확히 담긴 차별화된 결과물을 제공한다.
      - 작성한 내용의 근거와 설명 가능 여부를 확인하는 단계를 포함한다(functional_spec R9~R12).
    status: chosen
    reason: null
  - path: |-
      내 경험 기반 음성 모의면접 (실전 방어 훈련)
      - 시중에 있는 뻔한 일회성 면접 질문(예: "우리 회사 왜 지원했나요?")을 배제한다.
      - AI 면접관이 유저의 '자소서와 정제된 경험 데이터'의 맹점을 파고드는 다대일 압박 꼬리질문(예: "거기서 본인 빼도 결과는 똑같았을 것 같은데요?")을 실시간 음성으로 던진다.
      - 유저가 즉석에서 마이크로 답변하는 훈련을 반복시켜, 대본 암기 습관을 부수고 실전 담력과 논리적 순발력을 기른다.
    status: chosen
    reason: null
# reason(고른 이유)은 팀이 따로 말하지 않아 null로 둠. 학생 답 대기.
# 2026-10-30 참고(팀 결정 대기): 경로 3(서류 기반 음성 꼬리질문 모의면접)은 S11·S16·S19·S20과 겹친다. 기존 서비스에서 확인하지 못한 것은 면접관 2명(다대일)뿐인데,
#   다대일은 흔한 면접 형태가 아니다(S21, 2011년 자료). 경로 1(경험 스캐너)도 S17·S18과 일부 겹친다.
#   남은 차별점 후보("AI가 질문해서 경험을 끌어내기", "면접 결과가 자소서 보완으로 이어지기")는 경쟁 서비스를 직접 써 보고 확인해야 한다.
#   근거(S22, E4 Q7)가 가리키는 방향은 "제출 전 꼬리질문 점검"(경로 1·2). 경로 3을 보류(deferred)로 돌릴지는 팀 결정 대기.
#   설계 조건(가설): 혼자 점검하면 시간이 두 배 든다(E4 Q6) → 서비스가 점검 시간을 늘리지 않아야 한다.
# 2026-10-30 근거에 맞춰 claim을 고침. "경험의 부재가 아니다"는 S3(쓸 만한 스토리가 없어서 49.3%)와 부딪혀 대상을 좁히는 문장으로 바꿈.
# evidence는 팀원 수정안(2026-10-29 밤) 그대로.
insight:
  claim: |-
    1. 자소서가 어려운 이유로 "쓸 스토리가 없다"(49.3%, 2018) [S3]와 "평소에 정리하지 않았다"(47.3%, 2019) [S2]가 함께 나온다.
       우리는 이 중 경험은 있지만 정리되지 않은 사람을 대상으로 한다.
    2. 직접 쓴 문장은 꼬리질문에도 설명했지만, AI가 부풀린 문장에서는 막혔다 [E4 Q4].
       (가설) 문제는 문장이 아니라 "내가 설명할 수 있는지 모르는 것"이다.
    3. 기업은 근거 없는 문장을 구체적 추가 질문으로 가려낸다(78.6%) [S22].
       그러니 같은 질문을 제출 전에 받아 보는 게 필요하다 [E4 Q7](가설: 효과는 검증 대상).
  evidence: >-
    E1에서는 예상 답변을 외워 준비했지만 꼬리질문에서 자신의 경험을 설명하지 못했다.
    E2에서는 협업 과정과 본인의 기여도를 자소서로 구체화하기 어려웠다.
    E1은 선발 면접, E2는 서류 작성 사례이므로 핵심 고객의 수요나 서비스 효과를 입증하는 자료로 일반화하지 않는다.
  design_decision: >-
    우리가 개발할 '대화형 자소서 및 압박 면접 훈련 웹서비스'는 위 통찰을 바탕으로 3단계(경험 스캐너 → 맞춤형 자소서 빌더 → 내 경험 기반 음성 모의면접)의 논리적 해결책을 제공한다.
features:
  # 출처: 팀원 설계 docs/interview-design.md(2026-10-29)와 학생 답(2026-10-29 밤). 설계에 없는 것은 "학생 답 대기"로 주석.
  # 사용자가 넣는 것 → 저장·보이는 결과 → 관찰할 수 있는 완료 조건.
  - id: F1
    name: 회원가입·로그인
    input: 이메일·비밀번호
    output: 취준생 계정이 만들어지고 로그인 상태가 된다. 역할은 취준생 하나. 이력서·자기소개서·면접 기록은 계정별로 따로 남는다.
    done: 아이디/비밀번호로 바로 로그인되고, 다시 접속해도 내 이력서·자기소개서·면접 기록이 그대로 보인다. 로그인 전에는 로그인 필요 화면이 열리지 않는다.
  # F1 역할: 취준생 하나만(학생 답 2026-10-29). 흐름 account·시드 계정 역할 이름으로 그대로 씀.
  - id: F2
    name: 이력서 템플릿 입력
    input: >-
      9개 항목(1분 자기소개, 직무 관련 성공경험, 직무를 위해 준비한 사항, 지원동기, 입사 후 포부, 성격의 장단점,
      위기 극복 경험, 성장과정, 팀워크 및 협업경험) 중 원하는 항목 선택 → 고른 항목마다 생긴 칸에 글 입력
    output: 고른 항목과 입력한 글이 내 이력서로 저장된다.
    done: >-
      항목 3개를 골라 채우고 저장하면 다시 접속해도 같은 3개 항목과 내용이 보인다.
      항목을 하나도 안 고르거나 칸을 비운 채 저장하면 경고가 보이고 저장되지 않으며 다시 입력하게 된다.
      저장 뒤 내용 수정과 항목 추가가 된다. (학생 답 2026-10-29)
  - id: F3
    name: 맞춤형 자기소개서 만들기(템플릿 선택)
    input: >-
      지원할 기업(직접 기술) + 본인 직무기술(자기소개 글) → AI가 제시한 템플릿 중 하나 선택
    output: >-
      AI가 고른 템플릿 양식에 맞춰 자기소개서를 수정해 보여 주고, 내 자기소개서 목록에 저장한다.
    done: >-
      기업과 직무기술을 입력하면 AI가 템플릿을 제시하고, 하나를 고르면 그 양식으로 수정된 자기소개서가 화면에 보인다.
      내 자기소개서 목록에 저장돼 다시 접속해도 보이고 모의면접(F5)에서 고를 수 있다. AI 호출이 실패하면 에러가 표시되고 저장되지 않는다.
  # F3 (학생 답 2026-10-29) 이전 "이력서로 초안 생성"을 이 기능으로 대신한다. 기업은 직접 기술, 결과는 내 자기소개서 목록에 저장되어 모의면접에서 고를 수 있다. AI 실패 시 에러 표시(이전 F3 답 유지).
  # 학생 답 대기: 이력서(F2)를 이 기능에 쓰는지, AI가 제시하는 템플릿 개수·종류, 입력이 비었을 때 동작, 수정 결과를 사용자가 고칠 수 있는지.
  - id: F4
    name: 기존 자기소개서 등록
    input: 이미 쓴 자기소개서 글 붙여넣기
    output: 내 자기소개서로 저장된다. 자기소개서는 여러 개 둘 수 있다.
    done: 붙여 넣고 저장하면 자기소개서 목록에 보이고 다시 접속해도 그대로다. 빈 글은 저장되지 않고 이유를 보여 준다.
  # F4 (학생 답 2026-10-29) 자기소개서는 여러 개 둘 수 있다. 빈 글 저장 안 됨 확인.
  - id: F5
    name: 모의면접 시작(본질문 생성)
    input: 내 자기소개서 하나 선택 → "면접 시작"
    output: >-
      AI 호출 한 번으로 본질문 4개(실무 면접관 2·임원 면접관 2)를 자기소개서에 맞춰 만들고, 질문마다 면접관·확인 목적·근거 자기소개서 문장을 함께 저장한다.
      순서는 세션 생성 때 한 번 랜덤으로 정해 저장한다. 생성에 실패하면 기본 질문 템플릿을 쓰고 그 상태를 기록한다.
      첫 질문이 화면에 글자로 보이고 TTS로 읽어 준다.
    done: 면접 시작 뒤 첫 질문(면접관 이름 포함)이 글자로 보이고, 새로고침해도 같은 질문·같은 순서다.
  - id: F6
    name: 답변 제출(음성 기본, 글자도 가능)
    input: 음성 답변(브라우저에서 녹음 → 우리 서버 → Gateway의 OpenAI STT 모델로 전사 → 전사 내용을 확인·수정 뒤 제출) 또는 글자 답변
    output: >-
      답변이 저장되고, AI 호출 한 번으로 현재 질문의 확인 상태(설명됨 / 추가 확인 필요 / 모름·경험 없음)를 갱신해
      꼬리질문(그 본질문의 면접관이 계속, 본질문당 최대 2개) 또는 다음 본질문으로 넘어간다.
      전체 질문 최대 12개·진행 최대 12분에 닿으면 현재 답변을 마친 뒤 종료한다. 답변에 점수를 매기지 않는다.
    done: 글자로 답을 내면 다음 질문(꼬리질문 또는 다음 본질문)이 글자로 보이고, 질문·답변 기록에 방금 답이 한 줄 추가된다.
  # F6 전사 방식(학생 답 2026-10-29): OpenAI STT 모델. 키는 서버만 읽으므로 프런트가 OpenAI를 직접 부르지 않고 서버 경유(Gateway). 모델 이름(whisper-1 / gpt-4o-transcribe)은 3단계에서 Gateway 목록 확인 뒤 정함.
  # F6 (학생 답 2026-10-29) 전사 결과가 비면 다시 말하기 안내를 보여 준다.
  - id: F7
    name: 질문 건너뛰기·면접 종료
    input: 화면의 "건너뛰기" 버튼 또는 "면접 종료" 버튼
    output: 건너뛰면 다음 본질문으로 간다. 종료하면 종료 사유가 기록되고 결과 화면으로 간다. 질문 다시 듣기·음성 인식 재시도는 질문 수에 넣지 않는다.
    done: 어느 질문에서든 "면접 종료"를 누르면 결과 화면이 열리고 종료 사유가 기록돼 있다.
  - id: F8
    name: 면접 결과와 자기소개서 보완
    input: 끝난 면접
    output: >-
      종합 점수 없이 (1) 질문·답변 기록(면접관·질문 목적 포함) (2) 구체화된 경험(역할·선택 이유·결과 중 새로 설명한 내용)
      (3) 아직 보완할 항목 최대 3개(해당 답변과 연결) (4) 자기소개서 수정 제안(어떤 문장을 왜 바꾸는지)을 보여 준다.
      사용자가 수정 제안을 승인하면 자기소개서에 반영되고, 거절하면 반영하지 않고 그대로 둔다. 지난 면접 결과는 나중에 다시 볼 수 있다.
    done: 결과 화면에 질문·답변 기록과 보완 항목이 보이고, 수정 제안을 승인하면 자기소개서 본문이 바뀐 채 저장돼 다시 접속해도 유지된다.
  # F8 (학생 답 2026-10-29) 거절하면 그대로 둠, 지난 결과 다시 보기 가능.
  - id: F9
    name: 면접 중 내 카메라 화면
    input: 브라우저 카메라 권한 허용 여부
    output: 면접 화면에 내 카메라 영상을 보여 주기만 한다(저장·전송 없음). 카메라가 없거나 꺼져 있으면 그 자리에 검은 화면이 보인다.
    done: 카메라를 허용하면 면접 화면에 내 영상이 보이고, 카메라가 없는 브라우저(자동 테스트 포함)에서는 검은 화면이 보이며 면접은 그대로 진행된다.
  # F9 출처: 학생 답 2026-10-29(플랫폼 이유에서 나온 UI 요소).
  # F10 출처: 팀원 수정안(2026-10-29 밤). solution_paths 3번(내 경험 기반 음성 모의면접)의 "답변 훈련을 반복"에 속하는 기능.
  - id: F10
    name: 보완한 경험으로 다른 각도의 질문에 재답변
    input: 기존 면접 기록, 선택한 보완 항목, 사용자가 추가한 사실
    output: 기존 경험과 연결된 재연습 질문·답변 및 최초 답변과의 비교
    done: >-
      사용자가 결과에서 보완할 경험을 선택해 자신의 설명을 추가하고 같은 경험을 다른 각도에서 묻는 질문에 답한 뒤,
      최초 답변과 재연습 답변을 함께 보고 새로 설명한 사실을 확인하며 기록을 다시 열 수 있다.
# 기능 명세서(2026-10-30 고도화). 기존 features(F1~F10)는 그대로 둔다.
# 근거 규칙: 이 파일의 functional_spec 밖 항목(statement·canvas·alternatives·experiences·sources·five_whys·solution_paths·insight)에 둔다.
#   근거가 없으면 학생에게 묻고, 답은 "학생 답(2026-10-30)"으로 적는다.
#   F1~F10은 보류된 모의면접 항목(deferred)에만 근거로 쓴다(학생 답 2026-10-30).
# 핵심: 경험을 대화로 꺼내 사실을 확정하고, 제출 전 자소서의 주장 문장마다 "물어보면 답할 수 있나"를 점검한다.
functional_spec:
  summary: >-
    경험을 대화로 꺼내 사실을 확정하고, 제출 전에 자소서의 주장 문장마다 면접관처럼 근거를 물어
    내가 설명할 수 있는 문장인지 점검하는 웹서비스
  summary_basis: five_whys Why 5(근본 문제), E4 Q7, insight 3, solution_paths 주석("제출 전 꼬리질문 점검")
  requirements:
    - id: R1
      area: 계정
      name: 회원가입·로그인
      desc: 이메일·비밀번호로 가입하고 로그인한다. 모든 데이터는 계정별로 분리된다.
      basis: 학생 답(2026-10-30)
    - id: R2
      area: 경험 발굴
      name: 경험 등록(단서 선택)
      desc: >-
        제목과 대략적 시기를 입력해 경험 하나를 만든다.
        사진·수상기록·문서/텍스트 단서가 있으면 함께 올리고, 없으면 단서 없이 바로 만들어 R3 대화로 넘어간다.
      basis: >-
        학생 답(2026-10-30 대화. 수상기록·사진 등 경험은 있는데 기억이 흐려 말하지 못하는 경우).
        단서 없이 등록하는 경로는 학생 답(2026-10-30). P1(과정 기록이 휘발됨)
    - id: R3
      area: 경험 발굴
      name: 대화로 경험 꺼내기
      desc: >-
        AI가 단서를 보고 상황·역할·행동·결과·의의를 묻고, 사용자는 글로 답한다.
        항목마다 상태(설명됨 / 추가 확인 필요 / 모름·경험 없음)를 대화 중에 실시간으로 보여 준다.
        질문 횟수에 상한은 없고, 사용자가 상태를 보고 스스로 대화를 멈춘다.
      basis: >-
        solution_paths 1(AI가 꼬리질문으로 파편화된 기억을 캐묻는다), A1 why_ours.
        글 답변·상태 3단계·실시간 표시·상한 없음은 학생 답(2026-10-30)
    - id: R4
      area: 경험 발굴
      name: 사실 확정
      desc: AI가 답변에서 뽑은 사실을 목록으로 보여 주고 사용자가 하나씩 확인·수정·삭제한다. 확정한 내용만 경험 카드에 저장한다.
      basis: A1 why_ours(사실을 사용자에게 묻고 저장), E4 Q2(AI가 부풀린 15%를 확인 없이 냄), insight 2
    - id: R5
      area: 경험 발굴
      name: 출처 표시
      desc: 각 사실에 출처(내가 말함 / 자료로 확인 / AI 제안·미확인)를 붙인다. 미확인 사실은 자소서·점검의 근거로 쓰지 않는다.
      basis: E4 workaround(AI 초안 문장마다 "진짜 있었던 일인가"를 메모함), E4 Q2. "자료로 확인"은 R2에 따름
    - id: R6
      area: 경험 발굴
      name: 경험 카드 관리
      desc: 경험 카드(상황·역할·행동·결과·의의)를 목록으로 보고 다시 열어 수정한다.
      basis: >-
        solution_paths 1(STAR 구조로 정제해 경험 포트폴리오로 아카이빙). 의의는 학생 답(2026-10-30 대화).
        항목을 R3과 같게 "역할"로 통일(학생 답 2026-10-30)
    - id: R7
      area: 자기소개서
      name: 자기소개서 등록
      desc: 이미 쓴 글을 붙여넣어 저장한다. 여러 개 둘 수 있고, 빈 글은 저장되지 않는다.
      basis: 학생 답(2026-10-30). 대상이 이미 AI로 초안을 쓰고 있음(S6 84%, E4 Q1)
    - id: R8
      area: 자기소개서
      name: 경험 기반 자기소개서 작성
      desc: >-
        희망 기업의 우대사항·인재상과 자소서 문항을 입력한다.
        문항마다 AI가 맞는 경험 카드를 이유와 함께 추천하고, 사용자가 카드 단위로 쓸지 말지 정한다.
        이미 다른 문항에 쓴 카드도 고를 수 있지만 그렇다고 표시한다.
        카드를 정하면 그 문항의 응답만 바로 만들고 다음 문항으로 넘어간다.
        응답은 고른 카드의 확정된 사실만으로 만들고, 응답마다 근거로 쓴 카드를 함께 저장한다.
        카드에 없는 내용(수치·기여도 등)은 넣지 않고, 사용자가 고쳐 저장한다.
      basis: >-
        solution_paths 2(지원 기업의 직무 공고와 자소서 문항에 맞춘 초안), E2(기업에 맞춰 매번 따로 작성하기 어려움).
        입력 항목(우대사항·인재상·문항)은 학생 답(2026-10-30).
        카드에 없는 내용 금지는 E4 Q2(AI가 넣은 수치를 면접에서 설명하지 못함).
        작성 단계에서 문항별로 카드를 정하는 흐름(AI 추천 + 사용자 결정, 카드 단위, 문항마다 하나씩 생성, 중복은 허용하되 표시)은 학생 답(2026-10-30)
    - id: R9
      area: 제출 전 점검
      name: 주장 문장 고르기
      desc: 자기소개서에서 수치·성과·역할·평가 표현이 들어간 주장 문장을 AI가 골라 점검 목록으로 보여 준다.
      basis: E4 Q2("폐기율 15%", "데이터 기반"에서 막힘). AI가 고르는 방식은 학생 답(2026-10-30)
    - id: R10
      area: 제출 전 점검
      name: 문장 근거 묻기
      desc: >-
        문장마다 면접관처럼 근거를 묻는다(예: 수치의 계산 방법·기간, 표현에 해당하는 실제 행동).
        사용자는 글로 답한다. 답이 흐리면(judge 기준) 빠진 요소를 다른 각도로 다시 묻고, 첫 질문을 빼고 최대 3번까지 묻는다.
      judge:
        # 흐림 판단 기준. 문장에 해당하는 요소만 본다. 하나라도 빠지면 흐림이고, 다음 질문은 빠진 요소를 묻는다.
        - {id: J1, element: 수치의 출처, clear_if: 수치가 있는 문장이면 계산 방법, 비교 기준(무엇 대비), 기간을 말한다, basis: "E4 Q2(15%는 어떻게 계산, 기간은)"}
        - {id: J2, element: 본인의 행동, clear_if: 팀이 아니라 내가 한 행동을 구체적인 동작으로 말한다, basis: "E3(본인 역할을 빼도 결과가 같지 않나), five_whys symptom"}
        - {id: J3, element: 표현의 실체, clear_if: "'데이터 기반', '주도' 같은 평가 표현에 해당하는 실제 수단·도구·산출물을 말한다", basis: "E4 Q2(데이터 기반이라 썼는데 엑셀 질문에 막힘)"}
        - {id: J4, element: 단정, clear_if: "'체감상', '대략 그쯤'처럼 추정으로 얼버무리는 말 없이 답한다", basis: "E4 workaround(정확한 수치는 기억 안 나지만 체감상… 하고 얼버무림)"}
        # 기억이 나지 않는다·모른다고 답하면 J4로 다시 묻지 않고 R11의 "모름·경험 없음"으로 끝낸다(학생 답 2026-10-30).
      basis: >-
        five_whys Why 5, E4 Q7("제출하기 전에 누가 '이 15%는 어디서 나온 거예요?'라고 물어봐 줬으면"),
        E4 Q2(계산 방법·기간·엑셀 질문), S22(구체적 추가 질문 78.6%), insight 3. 상한 3·글 답변은 학생 답(2026-10-30)
    - id: R11
      area: 제출 전 점검
      name: 문장별 점검 결과
      desc: >-
        문장마다 상태를 점수 없이 보여 준다.
        설명됨: R10 judge 기준을 모두 충족. 추가 확인 필요: 상한까지 물어도 하나 이상 빠짐. 모름·경험 없음: 사용자가 그런 일이 없었거나 모른다·기억나지 않는다고 답함(이 판정을 J4보다 먼저 한다, 학생 답 2026-10-30).
        상한에 닿으면 다음 문장으로 넘어간다.
      basis: A1 why_ours(설명된 부분과 보완할 부분을 저장). 상태 3단계는 학생 답(2026-10-30)
    - id: R12
      area: 제출 전 점검
      name: 점검 사실을 경험 카드에 저장
      desc: 점검 답변에서 나온 사실을 목록으로 보여 주고, 사용자가 확인한 것만 해당 경험 카드에 추가한다.
      basis: 학생 답(2026-10-30). C1과 같은 원칙
    - id: R13
      area: 결과
      name: 문항별 응답과 근거 경험 카드
      desc: >-
        자소서 문항마다 AI가 만든 응답과, 그 응답에서 근거로 쓴 경험 카드 목록을 함께 보여 준다.
        사용자는 카드가 문항에 맞지 않거나 과하게 끌어다 썼는지(과적합) 스스로 판단해,
        그 문항의 카드 선택(R8)으로 돌아가 다시 고르고 그 문항을 다시 만들 수 있다.
        내용이 부족한 카드는 열어 보강(R3 대화 이어가기 또는 R6 수정)한 뒤 다시 만들 수 있다.
        사용자가 고친 응답이 있으면 다시 만들기 전에 덮어쓴다고 알리고 확인을 받는다.
      basis: >-
        학생 답(2026-10-30). 근거 카드를 보여 주는 것은 R5·C1(확인한 사실만 근거로 씀)과 같은 원칙.
        카드 선택을 작성 단계(R8)로 옮기고, 생성 후에는 근거 보기와 다시 선택만 두기로 함(학생 답 2026-10-30)
  constraints:
    - id: C1
      desc: AI가 만든 내용 중 사용자가 확인하지 않은 것은 사실로 저장하지 않는다.
      basis: E4 Q2, insight 2
    - id: C2
      desc: AI 호출이 실패하면 에러를 보여 주고 저장하지 않으며, 재시도 버튼을 둔다.
      basis: 학생 답(2026-10-30)
    - id: C3
      desc: 로그인 전에는 서비스 소개 페이지만 보이고, 나머지 기능은 로그인 후에 쓸 수 있다.
      basis: 학생 답(2026-10-30)
    - id: C4
      desc: >-
        AI는 점검 결과를 보고 문장을 알아서 고쳐 쓰지 않는다. 설명된 부분과 보완할 부분만 보여 준다.
        응답을 다시 만드는 것은 사용자가 그 문항의 카드를 다시 고르거나 보강한 뒤 요청할 때만 한다(R13).
      basis: A1 why_ours("답변 문장을 대신 완성하는 것보다 사용자가 경험을 설명"), insight 2
    - id: C5
      desc: (가설) 점검 때문에 자소서 준비 시간이 늘어나면 안 된다. 기준 값은 아직 없다.
      basis: solution_paths 주석 설계 조건, E4 Q6(혼자 점검하니 시간이 두 배)
  # 보류: solution_paths 3(음성 모의면접)을 보류로 돌림(학생 답 2026-10-30). 결과·보완·재답변도 면접 결과 기반이라 함께 보류.
