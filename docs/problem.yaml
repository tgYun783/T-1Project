five_whys:
  # 대표 경험 E4를 분석하며 전체 취준생의 공통 원인으로 일반화하지 않는다.
  symptom: >-
    E4는 자소서에 적힌 "폐기율 15% 감소"의 계산 방법·기간과
    "데이터 기반"이라는 표현에 해당하는 사용 도구를 질문받았을 때
    설명하지 못했다 [E4].
  whys:
    - >-
      왜 설명하지 못했나?
      E4는 실제 경험이 유통기한 지난 우유가 조금 줄었던 정도였고,
      15%라는 수치는 AI가 넣었으며 "데이터 기반"도 본인이 쓴 표현이
      아니었다고 말했다. 반면 직접 작성한 동아리 회계 경험은
      꼬리질문에도 답했다 [E4].
    - >-
      왜 해당 수치와 표현이 자소서에 남았나?
      경험을 간단히 적어 ChatGPT로 초안을 받고 조금씩 고쳐 제출했으며,
      AI가 숫자를 넣어 그럴듯하게 만든 부분은 "그냥 뒀다"고 말했다 [E4].
  # 미확인: 왜 해당 부분을 그대로 두었는지는 직접 확인하지 못했다.
  # 마감이 몰려 회사당 30분도 쓰지 못했다는 진술은 있으나,
  # 이것이 해당 문장을 그대로 둔 이유인지는 확인되지 않았다.
  # S24는 막막함의 원인을 설명하지 않으므로 이 사슬의 근거로 사용하지 않는다.
  # S2의 경험 정리 부족은 별도 조사의 배경 자료이며 E4의 원인으로 연결하지 않는다.
  # 팀의 문제 초점은 자소서 문장을 실제 행동·판단·수치의 근거와 대조하고,
  # 제출 전에 설명 가능한 내용인지 점검하는 어려움이다.
  # E4에서 확인된 것은 AI가 넣은 문장을 그대로 두고 제출한 행동과
  # 이후 근거 질문에 답하지 못한 경험이다.
  # 그 문장을 그대로 둔 이유까지 확인된 것은 아니므로,
  # "스스로 구분하지 못해서"를 확정된 원인으로 단정하지 않는다 [E4].
  # (2026-10-30 학생 검토본. 이전 5 Whys는 git 기록에 있음.)
# 팀 답 그대로(2026-10-29). 처음에는 세 경로를 팀이 "우리가 개발할 대화형 자소서 및 압박 면접 훈련 웹서비스"의 단계로 선택함.
# 2026-10-30 학생 답: 경로 3(음성 모의면접)은 보류가 아니라 기각. 경로 3과 functional_spec 보류 목록(D1~D9)을 지움. 이전 내용은 git 기록에 있음.
solution_paths:
  # 2026-10-30 학생 답: 경로 1도 R4처럼 사용자가 확인한 것만 저장하는 뜻으로 맞춤("자동 정제" 문장 교체).
  #   둘째 줄 문구는 functional_spec R4·R5·R6 desc에서 옮김.
  - path: |-
      경험 스캐너 (발굴 및 구조화)
      - 유저가 빈칸을 채우는 것이 아니라, AI 챗봇이 "당시 갈등 상황은 어땠나요?", "본인이 낸 아이디어는 무엇이었나요?" 등 꼬리질문을 던지며 과거 프로젝트의 파편화된 기억을 대화로 캐묻는다.
      - AI가 답변에서 뽑은 사실을 목록으로 보여 주고 사용자가 하나씩 확인·수정·삭제한다.
        확정한 내용만 출처(내가 말함 / 자료로 확인 / AI 제안·미확인)와 함께 경험 카드(상황·역할·행동·결과·의의)에 저장한다.
    status: chosen
    reason: |-
      E2는 협업 과정과 본인의 기여를 구체적으로 정리하기 어려웠고,
      E3은 외운 답변 밖에서 본인 역할을 설명하지 못했다 [E2][E3].
      S2에서도 평소 경험·경력을 정리하지 않은 점이 서류 작성의 어려움으로 보고됐다 [S2].
      이에 경험을 질문으로 구체화하고, 사용자가 사실을 확인해
      다시 활용할 수 있도록 저장하는 경로를 선택한다.
      경쟁 서비스에도 대화형 경험 정리가 있으므로 [S30],
      시장에 해당 기능이 없다는 이유로 선택한 것은 아니다.
  # 2026-10-30 학생 답: "구체적 기여도(%)" 문장은 뺌(카드에 없는 수치·기여도를 넣지 않는 R8과 맞춤).
  #   제출 전 주장 문장 근거 점검은 자소서를 제출하기 전에 확인하는 단계라 경로 2 안에 둔다(학생 답 2026-10-30).
  #   둘째·셋째 줄 문구는 functional_spec R8·R9·R10·R11 desc에서 옮김.
  - path: |-
      맞춤형 자소서 빌더 (증명 및 문서화)
      - 정제된 STAR 데이터를 활용해 지원 기업의 직무 공고와 자소서 문항에 최적화된 초안을 도출한다.
      - 응답은 사용자가 고른 경험 카드의 확정된 사실만으로 만들고, 카드에 없는 내용(수치·기여도 등)은 넣지 않는다.
      - 제출 전 점검: 자기소개서에서 수치·성과·역할·평가 표현이 들어간 주장 문장을 AI가 골라,
        문장마다 면접관처럼 근거를 묻고(수치의 계산 방법·기간, 표현에 해당하는 실제 행동)
        설명됨 / 추가 확인 필요 / 모름·경험 없음으로 점수 없이 보여 준다.
    status: chosen
    reason: |-
      E2는 기업별 문항에 맞춰 자신의 경험과 기여를 작성하는 데 어려움을 겪었다.
      E4는 AI가 넣은 수치·표현을 자소서에 남겼고,
      면접에서 그 근거를 설명하지 못했다 [E2][E4].
      이에 사용자가 확정한 경험 사실로 초안을 작성하고,
      제출 전 주장 문장의 근거를 질문하는 경로를 선택한다.
      카드에 없는 수치·성과를 추가하지 않고, 점검 결과만으로 자동 수정하지 않는다.
      이 설계가 면접 답변이나 합격을 보장한다고 주장하지 않는다.
# 팀 합의 당사자와 정확한 합의 시각은 별도로 확인되지 않아 기록하지 않는다.
# 2026-10-30 경로 1·2 reason은 학생 검토본으로 교체(이전 초안은 git 기록).
#   S1·S22·S25는 본문 인용이 없어졌지만 sources에는 남겨 둔다.
# 참고: 경로 1(경험 스캐너)은 S17·S18과 일부 겹친다. 차별점 후보("AI가 질문해서 경험을 끌어내기")는 경쟁 서비스를 직접 써 보고 확인해야 한다.
#   근거(S22, E4 Q7)가 가리키는 방향은 "제출 전 꼬리질문 점검"(경로 1·2).
#   설계 조건(가설): 혼자 점검하면 시간이 두 배 든다(E4 Q6) → 서비스가 점검 시간을 늘리지 않아야 한다.
# 2026-10-30 근거에 맞춰 claim을 고침. "경험의 부재가 아니다"는 S3(쓸 만한 스토리가 없어서 49.3%)와 부딪혀 대상을 좁히는 문장으로 바꿈.
# 2026-10-30 학생 검토본으로 insight 교체: claim은 대표 경험 E4의 관찰만, evidence는 E4(대표)·E3·E2(보조)와 배경 자료, design_decision은 관찰→설계 연결·만드는 것·사용자 행동 변화·만들지 않는 것.
#   이전 claim(S3·S2 대상 좁히기, E4 가설, S22)과 evidence(E1·E2)는 git 기록에 있음. 음성 모의면접은 기각(학생 답 2026-10-30).
insight:
  claim: |-
    E4는 AI로 작성한 자소서에 들어간 수치·표현의 근거를 묻는 질문에는
    답하지 못했지만, 직접 작성한 동아리 회계 경험의 꼬리질문에는 답했다.
    자소서 문장과 AI 예상 답변을 외워 준비했어도,
    해당 수치의 계산 방법·기간과 사용 도구를 설명하는 데에는 막혔다.
    면접 이후에는 문장마다 실제로 있었던 일인지, 질문받으면 답할 수 있는지
    메모하며 점검하기 시작했다 [E4].

  evidence: |-
    대표 경험 E4: 팀 밖 인터뷰 대상자 1명의 경험이다.
    경험을 간단히 적어 ChatGPT에 영업관리 직무용 초안을 요청하고,
    조금씩 수정해 제출했다.
    AI가 넣은 "폐기율 15%"는 "그냥 뒀다"고 했으며,
    면접에서 계산 방법·기간을 설명하지 못했다.
    "데이터 기반"이라는 표현에 관해 사용 도구를 묻는 질문에도 막혔다.
    반면 직접 쓴 동아리 회계 경험은 꼬리질문에도 답했다.
    준비한 AI 예상 질문에는 해당 수치의 근거를 묻는 질문이 없었다.
    이후 문장별로 직접 점검하기 시작했고, 시간이 두 배 걸린다고 보고했다.
    점검 시간은 자가보고이며 절대 시간과 비교 기준은 측정하지 않았다.

    보조 경험 E3: 팀원이 전달받은 친구의 경험이다.
    외운 대본에 의존해 준비했고, 성과 중 본인의 역할을 묻는
    추가 질문에서 설명하지 못했다.

    보조 경험 E2: 팀원이 지인에게 듣고 정리한 경험이다.
    협업 과정과 구체적 기여도를 서술하는 자소서 문항에서 막혔다.
    작성에 며칠을 쓰는 동안 같은 주에 마감한 다른 기업 두 곳에 지원하지 못했다.

    배경 자료: S3의 2018년 조사에서는 쓸 스토리가 없다는 응답이 49.3%였고,
    S2의 2019년 조사에서는 평소 정리하지 않은 점이 막막한 이유로 47.3% 보고됐다.
    두 수치는 서로 다른 조사의 결과이며 E4의 원인을 입증하는 자료는 아니다.

  design_decision: |-
    관찰에서 설계로의 연결:
    E4는 직접 작성한 회계 경험은 설명했지만, AI가 넣은 수치·표현의
    근거 질문에는 막혔다. 이에 대응해 사용자 확인 사실로 초안을 작성하고,
    생성된 문장도 제출 전에 근거 질문으로 점검하도록 설계한다.
    준비한 예상 질문에 해당 수치의 근거 질문이 없었고,
    사후에 혼자 문장별 점검을 하며 범위와 시간의 부담을 겪었다.
    따라서 점검할 주장 문장을 AI가 먼저 찾아 목록으로 제시한다.
    이는 관찰에 대응한 설계 결정이며 효과가 검증됐다는 뜻은 아니다.

    기존 기능 명세에 따라 만드는 것:
    1. 경험 스캐너: 단서를 바탕으로 질문하며 경험을 구체화하고,
       사용자가 확인한 사실과 미확인 내용을 구분한다.
    2. 자소서 빌더와 제출 전 점검: 사용자가 확정한 사실로 초안을 만든다.
       AI가 자소서에서 수치·성과·역할·평가 표현이 들어간 주장 문장을 골라
       점검 목록으로 보여 주고, 해당 문장의 근거를 질문한다.
       새로 확인한 사실은 사용자 확인을 거쳐 경험 카드에 저장한다.

    사용자 행동 변화:
    초안과 예상 답변을 외우는 데서 끝내지 않고,
    제출 전에 문장의 근거를 직접 설명해 본다.
    설명하지 못한 내용은 사실을 보강하거나 제외 여부를 결정한 뒤,
    필요한 경우 사용자가 요청해 자소서를 다시 생성한다.

    만들지 않는 것:
    사용자가 확인하지 않은 수치·성과를 사실처럼 추가하지 않는다.
    점검 결과만으로 자소서 문장을 자동 수정하지 않는다.
    점검은 점수 대신 기존 기능 명세의 상태로 표시한다.
  # 2026-10-30 학생 답: 음성 모의면접은 보류가 아니라 기각이라 insight에서 "음성 모의면접: 팀 결정 대기" 문단을 지움.
features:
  # 2026-10-30 학생 답("현재 범위에 맞춰 줘"): features를 functional_spec R1~R13(현재 범위)에 맞춤.
  # 2026-10-30 제출 점검(features ID는 F1, F2… 형식): id를 F1~F13으로 바꿈. F번호는 같은 번호의 functional_spec R번호와 같다(F1=R1 … F13=R13).
  # 옮긴 방법: name·input·output은 functional_spec의 각 요구사항 desc에서, done은 docs/scenarios.yaml 흐름 S1~S6의 expected에서 옮김(괄호의 '흐름 S#'은 sources가 아니라 흐름 번호).
  #   해당 흐름이 없는 R4·R12는 desc와 C1(확인하지 않은 것은 사실로 저장하지 않음)의 문장으로 done을 씀.
  # 이전 features F1~F10(이력서 템플릿·템플릿 자소서·모의면접, 지금 F번호와 다름)은 git 기록(커밋 be89002)에 있다.
  #   이전 F2·F3는 뺐고, 이전 F5~F10(모의면접)은 기각(학생 답 2026-10-30).
  - id: F1
    name: 회원가입·로그인
    input: 이메일·비밀번호
    output: 계정이 만들어지고 로그인 상태가 된다. 모든 데이터는 계정별로 분리된다.
    done: >-
      가입하면 로그인된 상태로 홈이 열리고, 경험 카드를 먼저 하나 확정해야 자소서를 쓸 수 있다는 안내와 '이력서 입력' 버튼이 보인다.
      '새로 쓰기' 버튼은 보이지 않는다(흐름 S1). 로그인 전에는 서비스 소개 페이지만 보인다(C3).
  # 2026-10-30 팀이 R2를 "이력서로 경험 만들기"로 바꿈(커밋 b74a9f4). F2는 functional_spec R2 desc와 scenarios.yaml S2 steps에서 옮겨 맞춤.
  - id: F2
    name: 이력서로 경험 만들기
    input: 이력서 글 붙여넣기. 나뉜 활동 목록에서 고치기·빼기, 빠진 활동은 '활동 직접 추가'(활동 이름·대략적 시기)
    output: >-
      AI가 이력서를 활동(프로젝트·동아리·대외활동 등)으로 나눠 제목과 대략적 시기를 붙인다.
      사용자가 확정한 활동 하나가 경험 하나가 되고, 활동마다 F3 질문으로 넘어간다.
    done: "'활동 직접 추가'로 '활동 이름'과 '대략적 시기'를 넣고 '목록에 추가'한 뒤 '경험 만들기'를 누르면 경험이 만들어지고 경험 상세 화면이 열린다(흐름 S2)."
  - id: F3
    name: 대화로 경험 꺼내기
    input: AI가 이력서에서 나온 활동 내용과 단서를 보고 상황·역할·행동·결과·의의를 묻는 질문에 대한 글 답변. 단서(사진·수상기록·문서/텍스트)는 이 화면에서 원하면 추가
    output: >-
      대화가 이어지고, 항목마다 상태(설명됨 / 추가 확인 필요 / 모름·경험 없음)가 대화 중에 실시간으로 보인다.
      질문 횟수에 상한은 없고 사용자가 상태를 보고 스스로 멈춘다.
    done: >-
      답을 보내면 대화에 방금 보낸 답과 AI의 다음 질문이 보이고, 다섯 항목 중 하나 이상에 '설명됨', '추가 확인 필요', '모름·경험 없음' 중 하나가 보인다.
      AI 호출에 실패하면 에러 안내와 '다시 시도' 버튼이 보이고 입력한 답은 입력칸에 남아 있다(흐름 S4, C2).
  - id: F4
    name: 사실 확정
    input: AI가 답변에서 뽑은 사실 목록에서 하나씩 확인·수정·삭제
    output: 확정한 내용만 경험 카드에 저장된다.
    done: 사용자가 확인한 사실만 경험 카드에 보이고, 확인하지 않은 사실 후보는 경험 카드에 저장되지 않는다(R4 desc, C1).
  - id: F5
    name: 출처 표시
    input: 사실마다 출처(내가 말함 / 자료로 확인 / AI 제안·미확인)
    output: 각 사실에 출처가 붙는다. 미확인 사실은 자소서·점검의 근거로 쓰지 않는다.
    done: 직접 추가한 사실은 '내가 말함'과 함께 보이고(흐름 S2), AI가 뽑은 사실 후보는 'AI 제안·미확인'으로 표시된다(흐름 S4).
  - id: F6
    name: 경험 카드 관리
    input: 경험 카드(상황·역할·행동·결과·의의) 목록에서 카드를 다시 열어 수정
    output: 수정한 경험 카드가 저장된다.
    done: 경험 카드의 역할 칸에 '직접 추가'로 입력한 내용이 '내가 말함'과 함께 보이고, 확정 사실이 있는 카드가 생기면 자소서 화면의 잠금 안내 대신 '새로 쓰기'와 '쓴 자소서 붙여넣기' 버튼이 보인다(흐름 S2).
  - id: F7
    name: 자기소개서 등록
    input: 이미 쓴 자기소개서 글 붙여넣기
    output: 자기소개서로 저장된다. 여러 개 둘 수 있다.
    done: 본문이 비었을 때는 저장되지 않고 이유가 보인다. 입력한 뒤 저장하면 자소서 상세에 본문이 그대로 보이고, 자소서 목록에 '붙여넣음' 자소서가 하나 늘어 있다(흐름 S3).
  - id: F8
    name: 경험 기반 자기소개서 작성
    input: 희망 기업의 우대사항·인재상, 자소서 문항. 문항마다 AI가 추천한 경험 카드 중 쓸 카드를 카드 단위로 선택
    output: >-
      카드를 정하면 그 문항의 응답만 바로 만들고 다음 문항으로 넘어간다. 응답은 고른 카드의 확정된 사실만으로 만들고,
      응답마다 근거로 쓴 카드를 함께 저장한다. 카드에 없는 내용(수치·기여도 등)은 넣지 않는다.
    done: >-
      카드를 켜고 '이 문항 만들기'를 누르면 문항 1의 응답 글이 보이고, 그 아래 근거로 쓴 경험 카드가 보인다.
      자소서 목록에 '작성함' 자소서가 하나 늘어 있다. AI 호출에 실패하면 에러 안내와 '다시 시도' 버튼이 보인다(흐름 S5).
  - id: F9
    name: 주장 문장 고르기
    input: 자기소개서에서 '제출 전 점검 시작'
    output: 수치·성과·역할·평가 표현이 들어간 주장 문장을 AI가 골라 점검 목록으로 보여 준다.
    done: "'제출 전 점검 시작'을 누르면 점검할 주장 문장 목록과 첫 질문이 보인다(흐름 S6)."
  - id: F10
    name: 문장 근거 묻기
    input: 문장마다 면접관처럼 묻는 근거 질문(수치의 계산 방법·기간, 표현에 해당하는 실제 행동)에 대한 글 답변
    output: 답이 흐리면(judge J1~J4) 빠진 요소를 다른 각도로 다시 묻는다. 첫 질문을 빼고 최대 3번까지 묻는다.
    done: 답을 내면 방금 낸 답이 기록에 추가되고, 그 문장에 다음 질문이 보이거나 상태가 보인다(흐름 S6).
  - id: F11
    name: 문장별 점검 결과
    input: 문장마다 끝난 근거 질문과 답
    output: 문장마다 상태(설명됨 / 추가 확인 필요 / 모름·경험 없음)를 점수 없이 보여 준다.
    done: 점검한 문장에 '설명됨', '추가 확인 필요', '모름·경험 없음' 중 하나가 보이고, 점수는 어디에도 보이지 않는다(흐름 S6).
  - id: F12
    name: 점검 사실을 경험 카드에 저장
    input: 점검 답변에서 나온 사실 목록에서 사용자가 확인한 것
    output: 사용자가 확인한 사실만 해당 경험 카드에 추가된다.
    done: 점검 답변에서 나온 사실 중 사용자가 확인한 것만 해당 경험 카드에 보이고, 확인하지 않은 것은 추가되지 않는다(R12 desc, C1).
  - id: F13
    name: 문항별 응답과 근거 경험 카드
    input: 문항별 응답에서 근거 카드 다시 고르기, 내용이 부족한 카드 보강
    output: >-
      문항마다 응답과 근거로 쓴 경험 카드 목록을 함께 보여 준다. 그 문항의 카드 선택(R8)으로 돌아가 다시 고르고 다시 만들 수 있다.
      사용자가 고친 응답이 있으면 다시 만들기 전에 덮어쓴다고 알리고 확인을 받는다.
    done: 문항 응답 아래 근거로 쓴 경험 카드가 보인다(흐름 S5).
# 기능 명세서(2026-10-30 고도화). features F1~F13은 이 R1~R13에 맞췄다(학생 답 2026-10-30). 이전 features F1~F10은 git 기록(be89002).
# 근거 규칙: 이 파일의 functional_spec 밖 항목(statement·canvas·alternatives·experiences·sources·five_whys·solution_paths·insight)에 둔다.
#   근거가 없으면 학생에게 묻고, 답은 "학생 답(2026-10-30)"으로 적는다.
# 핵심: 경험을 대화로 꺼내 사실을 확정하고, 제출 전 자소서의 주장 문장마다 "물어보면 답할 수 있나"를 점검한다.
functional_spec:
  summary: >-
    경험을 대화로 꺼내 사실을 확정하고, 제출 전에 자소서의 주장 문장마다 면접관처럼 근거를 물어
    내가 설명할 수 있는 문장인지 점검하는 웹서비스
  summary_basis: five_whys Why 5(근본 문제), E4 Q7, insight 3, solution_paths 주석("제출 전 꼬리질문 점검")
  requirements:
    - id: R1
      area: 계정
      name: 회원가입·로그인
      desc: 이메일·비밀번호로 가입하고 로그인한다. 모든 데이터는 계정별로 분리된다.
      basis: 학생 답(2026-10-30)
    - id: R2
      area: 경험 발굴
      name: 이력서로 경험 만들기
      desc: >-
        이력서 글을 붙여넣으면 AI가 활동(프로젝트·동아리·대외활동 등)으로 나눠 제목과 대략적 시기를 붙인다.
        사용자는 나뉜 활동 목록을 확인하며 고치거나 빼고, 빠진 활동은 직접 추가한 뒤 확정한다.
        확정한 활동 하나가 경험 하나가 되고, 활동마다 R3 질문으로 넘어간다.
        이력서는 계정당 하나이고, 다시 붙여넣으면 새로 나온 활동만 목록에 더한다(이미 만든 경험은 그대로).
        경험을 이력서 없이 하나씩 따로 만드는 경로는 두지 않는다.
      basis: >-
        학생 답(2026-10-30: 이력서 글 붙여넣기 → AI가 활동을 나누고 사용자가 확인, 활동마다 카드 하나,
        확인 목록에서 직접 추가 가능, 이력서는 하나, 개별 등록 없앰).
        P1(7~8개 팀 프로젝트를 했지만 기록이 휘발됨), S2(평소에 정리하지 않아서 47.3%).
        이전 F2(이력서 9항목 빈칸 입력)와 달리 빈칸을 채우게 하지 않고 이미 있는 글에서 시작한다(solution_paths 1)
    - id: R3
      area: 경험 발굴
      name: 대화로 경험 꺼내기
      desc: >-
        AI가 이력서에서 나온 활동 내용과 단서를 보고 상황·역할·행동·결과·의의를 묻고, 사용자는 글로 답한다.
        단서(사진·수상기록·문서/텍스트)는 이 질문 화면에서 원하면 추가한다.
        항목마다 상태(설명됨 / 추가 확인 필요 / 모름·경험 없음)를 대화 중에 실시간으로 보여 준다.
        질문 횟수에 상한은 없고, 사용자가 상태를 보고 스스로 대화를 멈춘다.
      basis: >-
        solution_paths 1(AI가 꼬리질문으로 파편화된 기억을 캐묻는다), A1 why_ours.
        글 답변·상태 3단계·실시간 표시·상한 없음, 질문 화면에서 단서 선택 추가는 학생 답(2026-10-30)
    - id: R4
      area: 경험 발굴
      name: 사실 확정
      desc: AI가 답변에서 뽑은 사실을 목록으로 보여 주고 사용자가 하나씩 확인·수정·삭제한다. 확정한 내용만 경험 카드에 저장한다.
      basis: A1 why_ours(사실을 사용자에게 묻고 저장), E4 Q2(AI가 부풀린 15%를 확인 없이 냄), insight 2
    - id: R5
      area: 경험 발굴
      name: 출처 표시
      desc: 각 사실에 출처(내가 말함 / 자료로 확인 / AI 제안·미확인)를 붙인다. 미확인 사실은 자소서·점검의 근거로 쓰지 않는다.
      basis: E4 workaround(AI 초안 문장마다 "진짜 있었던 일인가"를 메모함), E4 Q2. "자료로 확인"은 R3의 단서에 따름
    - id: R6
      area: 경험 발굴
      name: 경험 카드 관리
      desc: 경험 카드(상황·역할·행동·결과·의의)를 목록으로 보고 다시 열어 수정한다.
      basis: >-
        solution_paths 1(STAR 구조로 정제해 경험 포트폴리오로 아카이빙). 의의는 학생 답(2026-10-30 대화).
        항목을 R3과 같게 "역할"로 통일(학생 답 2026-10-30)
    - id: R7
      area: 자기소개서
      name: 자기소개서 등록
      desc: 이미 쓴 글을 붙여넣어 저장한다. 여러 개 둘 수 있고, 빈 글은 저장되지 않는다.
      basis: 학생 답(2026-10-30). 대상이 이미 AI로 초안을 쓰고 있음(S6 84%, E4 Q1)
    - id: R8
      area: 자기소개서
      name: 경험 기반 자기소개서 작성
      desc: >-
        희망 기업의 우대사항·인재상과 자소서 문항을 입력한다.
        문항마다 AI가 맞는 경험 카드를 이유와 함께 추천하고, 사용자가 카드 단위로 쓸지 말지 정한다.
        이미 다른 문항에 쓴 카드도 고를 수 있지만 그렇다고 표시한다.
        카드를 정하면 그 문항의 응답만 바로 만들고 다음 문항으로 넘어간다.
        응답은 고른 카드의 확정된 사실만으로 만들고, 응답마다 근거로 쓴 카드를 함께 저장한다.
        카드에 없는 내용(수치·기여도 등)은 넣지 않고, 사용자가 고쳐 저장한다.
      basis: >-
        solution_paths 2(지원 기업의 직무 공고와 자소서 문항에 맞춘 초안), E2(기업에 맞춰 매번 따로 작성하기 어려움).
        입력 항목(우대사항·인재상·문항)은 학생 답(2026-10-30).
        카드에 없는 내용 금지는 E4 Q2(AI가 넣은 수치를 면접에서 설명하지 못함).
        작성 단계에서 문항별로 카드를 정하는 흐름(AI 추천 + 사용자 결정, 카드 단위, 문항마다 하나씩 생성, 중복은 허용하되 표시)은 학생 답(2026-10-30)
    - id: R9
      area: 제출 전 점검
      name: 주장 문장 고르기
      desc: 자기소개서에서 수치·성과·역할·평가 표현이 들어간 주장 문장을 AI가 골라 점검 목록으로 보여 준다.
      basis: E4 Q2("폐기율 15%", "데이터 기반"에서 막힘). AI가 고르는 방식은 학생 답(2026-10-30)
    - id: R10
      area: 제출 전 점검
      name: 문장 근거 묻기
      desc: >-
        문장마다 면접관처럼 근거를 묻는다(예: 수치의 계산 방법·기간, 표현에 해당하는 실제 행동).
        사용자는 글로 답한다. 답이 흐리면(judge 기준) 빠진 요소를 다른 각도로 다시 묻고, 첫 질문을 빼고 최대 3번까지 묻는다.
      judge:
        # 흐림 판단 기준. 문장에 해당하는 요소만 본다. 하나라도 빠지면 흐림이고, 다음 질문은 빠진 요소를 묻는다.
        - {id: J1, element: 수치의 출처, clear_if: 수치가 있는 문장이면 계산 방법, 비교 기준(무엇 대비), 기간을 말한다, basis: "E4 Q2(15%는 어떻게 계산, 기간은)"}
        - {id: J2, element: 본인의 행동, clear_if: 팀이 아니라 내가 한 행동을 구체적인 동작으로 말한다, basis: "E3(본인 역할을 빼도 결과가 같지 않나), five_whys symptom"}
        - {id: J3, element: 표현의 실체, clear_if: "'데이터 기반', '주도' 같은 평가 표현에 해당하는 실제 수단·도구·산출물을 말한다", basis: "E4 Q2(데이터 기반이라 썼는데 엑셀 질문에 막힘)"}
        - {id: J4, element: 단정, clear_if: "'체감상', '대략 그쯤'처럼 추정으로 얼버무리는 말 없이 답한다", basis: "E4 workaround(정확한 수치는 기억 안 나지만 체감상… 하고 얼버무림)"}
        # 기억이 나지 않는다·모른다고 답하면 J4로 다시 묻지 않고 R11의 "모름·경험 없음"으로 끝낸다(학생 답 2026-10-30).
      basis: >-
        five_whys Why 5, E4 Q7("제출하기 전에 누가 '이 15%는 어디서 나온 거예요?'라고 물어봐 줬으면"),
        E4 Q2(계산 방법·기간·엑셀 질문), S22(구체적 추가 질문 78.6%), insight 3. 상한 3·글 답변은 학생 답(2026-10-30)
    - id: R11
      area: 제출 전 점검
      name: 문장별 점검 결과
      desc: >-
        문장마다 상태를 점수 없이 보여 준다.
        설명됨: R10 judge 기준을 모두 충족. 추가 확인 필요: 상한까지 물어도 하나 이상 빠짐. 모름·경험 없음: 사용자가 그런 일이 없었거나 모른다·기억나지 않는다고 답함(이 판정을 J4보다 먼저 한다, 학생 답 2026-10-30).
        상한에 닿으면 다음 문장으로 넘어간다.
      basis: A1 why_ours(설명된 부분과 보완할 부분을 저장). 상태 3단계는 학생 답(2026-10-30)
    - id: R12
      area: 제출 전 점검
      name: 점검 사실을 경험 카드에 저장
      desc: 점검 답변에서 나온 사실을 목록으로 보여 주고, 사용자가 확인한 것만 해당 경험 카드에 추가한다.
      basis: 학생 답(2026-10-30). C1과 같은 원칙
    - id: R13
      area: 결과
      name: 문항별 응답과 근거 경험 카드
      desc: >-
        자소서 문항마다 AI가 만든 응답과, 그 응답에서 근거로 쓴 경험 카드 목록을 함께 보여 준다.
        사용자는 카드가 문항에 맞지 않거나 과하게 끌어다 썼는지(과적합) 스스로 판단해,
        그 문항의 카드 선택(R8)으로 돌아가 다시 고르고 그 문항을 다시 만들 수 있다.
        내용이 부족한 카드는 열어 보강(R3 대화 이어가기 또는 R6 수정)한 뒤 다시 만들 수 있다.
        사용자가 고친 응답이 있으면 다시 만들기 전에 덮어쓴다고 알리고 확인을 받는다.
      basis: >-
        학생 답(2026-10-30). 근거 카드를 보여 주는 것은 R5·C1(확인한 사실만 근거로 씀)과 같은 원칙.
        카드 선택을 작성 단계(R8)로 옮기고, 생성 후에는 근거 보기와 다시 선택만 두기로 함(학생 답 2026-10-30)
  constraints:
    - id: C1
      desc: AI가 만든 내용 중 사용자가 확인하지 않은 것은 사실로 저장하지 않는다.
      basis: E4 Q2, insight 2
    - id: C2
      desc: AI 호출이 실패하면 에러를 보여 주고 저장하지 않으며, 재시도 버튼을 둔다.
      basis: 학생 답(2026-10-30)
    - id: C3
      desc: 로그인 전에는 서비스 소개 페이지만 보이고, 나머지 기능은 로그인 후에 쓸 수 있다.
      basis: 학생 답(2026-10-30)
    - id: C4
      desc: >-
        AI는 점검 결과를 보고 문장을 알아서 고쳐 쓰지 않는다. 설명된 부분과 보완할 부분만 보여 준다.
        응답을 다시 만드는 것은 사용자가 그 문항의 카드를 다시 고르거나 보강한 뒤 요청할 때만 한다(R13).
      basis: A1 why_ours("답변 문장을 대신 완성하는 것보다 사용자가 경험을 설명"), insight 2
    - id: C5
      desc: (가설) 점검 때문에 자소서 준비 시간이 늘어나면 안 된다. 기준 값은 아직 없다.
      basis: solution_paths 주석 설계 조건, E4 Q6(혼자 점검하니 시간이 두 배)
  # 기각: 음성 모의면접(이전 보류 목록 D1~D9, 이전 features F5~F10)은 기각해 지움(학생 답 2026-10-30).
  # 뺀 것: 이전 F2(이력서 9항목 입력, solution_paths 1의 "빈칸 채우기 아님"과 충돌), 이전 F3(템플릿 선택 자소서, R8로 대체). 학생 답(2026-10-30)
  #   R2의 이력서는 이전 F2와 다르다: 항목 빈칸을 채우지 않고 이미 쓴 이력서 글을 붙여넣으면 AI가 활동으로 나눈다(학생 답 2026-10-30).
