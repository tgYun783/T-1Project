# 주최 측 실행과 CI가 이 파일로 앱을 빈 DB에서 띄운다. app(nginx, 3000) → server(NestJS) → db(MongoDB).
services:
  app:
    build:
      context: .
      args:
        RELEASE_ID: ${RELEASE_ID:-dev}
    ports:
      - "3000:3000"
    environment:
      RELEASE_ID: ${RELEASE_ID:-dev}
    depends_on:
      - server

  server:
    build:
      context: server
      args:
        RELEASE_ID: ${RELEASE_ID:-dev}
    environment:
      RELEASE_ID: ${RELEASE_ID:-dev}
      DATABASE_URL: mongodb://db:27017/app
      SEED_USER_EMAIL: seeker@example.com
      SEED_USER_PASSWORD: loopthon-2026
      SESSION_SECRET: local-only-session-secret-t1
      COOKIE_SECURE: "false"
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mongo:7
    volumes:
      - db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data: {}
