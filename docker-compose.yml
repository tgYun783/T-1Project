# 주최 측 실행과 CI가 이 파일로 앱을 빈 DB에서 띄운다. app(nginx, 3000) → server(NestJS, 3001) → db(MongoDB).
# 주최 측 실행은 시드 계정을 app의 environment에서 읽는다. server가 계정을 만들므로 두 곳에 같은 값을 적는다.
services:
  app:
    build:
      context: .
      args:
        RELEASE_ID: ${RELEASE_ID:-dev}
    ports:
      - "3000:3000"
    environment:
      RELEASE_ID: ${RELEASE_ID:-dev}
      SEED_USER_EMAIL: seeker@example.com
      SEED_USER_PASSWORD: loopthon-2026
      # 제출 요건이 app에서 이 줄을 찾는다. 실제로 키를 쓰는 곳은 server이고 nginx는 이 값을 쓰지 않는다.
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
    depends_on:
      - server

  server:
    build:
      context: server
      args:
        RELEASE_ID: ${RELEASE_ID:-dev}
    environment:
      RELEASE_ID: ${RELEASE_ID:-dev}
      DATABASE_URL: mongodb://db:27017/app
      SEED_USER_EMAIL: seeker@example.com
      SEED_USER_PASSWORD: loopthon-2026
      JWT_SECRET: local-only-jwt-secret-t1
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mongo:7
    volumes:
      - db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data: {}
